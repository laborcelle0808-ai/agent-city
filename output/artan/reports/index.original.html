<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Артан — тестовий застосунок</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&family=Ruslan+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B09;--sf:#151712;--sf2:#1E211A;--ln:#32372B;--tx:#EDEBE2;--mu:#A9AD9D;--ac:#C3C79A;--ye:#F2C230;--ok:#7BC47F;--bad:#EE8D7C;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{background:radial-gradient(120% 60% at 50% 0%,#1A1D14 0%,var(--bg) 60%) fixed}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
h1,h2,h3{font-family:Oswald,Inter,sans-serif;font-weight:600;margin:0;line-height:1.15}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}p{margin:0}
.wm{font-family:'Ruslan Display',Oswald,serif;font-weight:400;letter-spacing:3px;line-height:1}
.mu{color:var(--mu)}.sm{font-size:13px}.ey{font-size:11px;letter-spacing:1.5px;font-weight:600;color:var(--ac);text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:12px}.sb{justify-content:space-between}.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:linear-gradient(180deg,#191C15,#141610);border:1px solid var(--ln);border-radius:16px;padding:14px}
button,.btn{font:inherit;font-weight:600;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);cursor:pointer;text-align:center;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:active,.btn:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
button[disabled]{opacity:.6;cursor:default}
.pri{background:var(--ye);color:#14110A;border-color:var(--ye);box-shadow:0 6px 20px -8px rgba(242,194,48,.7)}
.ghost{background:transparent}
.view>*{animation:up .5s var(--ease) backwards}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(6){animation-delay:.25s}.view>*:nth-child(n+7){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes bump{50%{transform:scale(1.25)}}
header.top{padding:22px 0 4px}
.tile{flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;min-height:108px;text-align:left;padding:14px;border-radius:16px;background:linear-gradient(180deg,#191C15,#141610)}
.tile svg{color:var(--ye)}.tile b{font-size:15px;display:block}.tile span{font-size:12.5px;color:var(--mu);font-weight:400}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--ln);padding:18px;background:linear-gradient(135deg,#23271B,#12140E)}
.hero:after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 80%,rgba(242,194,48,.12) 90%,transparent);animation:spin 9s linear infinite;pointer-events:none}
.hero>*{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.em{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.dots{display:flex;gap:6px}.dots button{min-height:0;width:24px;height:24px;padding:0;border:0;background:transparent}.dots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--ln);margin:auto;transition:all .3s}.dots .on i{background:var(--ye);width:18px;border-radius:4px}
.fade{animation:up .45s var(--ease) backwards}
.bar{height:10px;border-radius:999px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ye));border-radius:999px;transition:width .8s var(--ease)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px}.seg button{min-height:40px;border:0;background:transparent;color:var(--mu);border-radius:10px}.seg button.on{background:var(--sf2);color:var(--ye)}
.date{width:62px;flex:none;font-family:Oswald,sans-serif;font-weight:600;font-size:14px;color:var(--ac);line-height:1.2;text-align:left}
.ph{height:160px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;text-align:center;padding:10px;border:1px dashed #6E7463;background:repeating-linear-gradient(45deg,#14160F 0 10px,#171A12 10px 20px)}
.photo{width:100%;max-height:280px;object-fit:cover;border-radius:14px;display:block;animation:pop .5s var(--ease)}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
input[type=text],input[type=tel],input[type=date]{width:100%;height:48px;padding:0 12px;border-radius:12px;border:1px solid #6E7463;background:var(--sf);color:var(--tx);font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--ye);box-shadow:0 0 0 3px rgba(242,194,48,.18);outline:0}
.chip{padding:8px 12px;border:1px solid #6E7463;border-radius:999px;font-size:13px;min-height:40px;background:transparent;font-weight:500}
.chip.on{background:var(--ye);color:#14110A;border-color:var(--ye)}
.msg{border-radius:12px;padding:12px;font-size:14px;animation:pop .35s var(--ease)}.msg.ok{background:#1B2A1C;border:1px solid var(--ok)}.msg.no{background:#2C1B18;border:1px solid var(--bad)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--ye);color:#14110A;font-size:12px;font-weight:600}.badge.off{background:var(--sf2);color:var(--mu)}
ul{margin:0;padding-left:20px}li{margin:6px 0}
.opt{width:100%;justify-content:flex-start;text-align:left;font-weight:500;min-height:54px;padding:10px 14px}
.opt.good{border-color:var(--ok);background:#1B2A1C;animation:bump .35s}.opt.wrong{border-color:var(--bad);background:#2C1B18;animation:shake .35s}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:20}
nav .in{pointer-events:auto;position:relative;max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(20,22,16,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:22px;padding:6px;box-shadow:0 14px 40px -10px #000}
nav .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:16px;background:linear-gradient(180deg,rgba(242,194,48,.2),rgba(242,194,48,.06));border:1px solid rgba(242,194,48,.35);transition:transform .45s var(--ease)}
nav a{position:relative;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--mu);text-decoration:none;border-radius:16px;transition:color .3s}
nav a svg{transition:transform .45s var(--ease)}
nav a.on{color:var(--ye);font-weight:600}nav a.on svg{transform:translateY(-2px) scale(1.14)}
nav a:active svg{transform:scale(.85)}
/* splash */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(80% 50% at 50% 45%,#22261A,#070806 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash .e{position:relative;width:190px;height:190px}
#splash .e img{width:100%;height:100%;object-fit:contain;animation:splash 1.2s var(--ease) both}
#splash .e:before,#splash .e:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(195,199,154,.5);animation:ring 2s ease-out infinite}
#splash .e:after{animation-delay:1s}
@keyframes splash{from{opacity:0;transform:scale(.6) rotate(-12deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes ring{from{transform:scale(.9);opacity:.8}to{transform:scale(1.5);opacity:0}}
#splash .wm{font-size:44px;display:flex;gap:4px}
#splash .wm span{animation:up .6s var(--ease) both}
#splash .ld{width:160px;height:3px;border-radius:3px;background:#2A2E22;overflow:hidden}#splash .ld i{display:block;height:100%;width:100%;background:var(--ye);transform-origin:left;animation:load 2s var(--ease) both}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* map */
.mapbox{position:relative;border-radius:18px;border:1px solid var(--ln);background:radial-gradient(circle at 50% 40%,#1C2015,#0E100B);overflow:hidden;padding:6px}
.mapbox svg{display:block;width:100%;height:auto}
.ua{fill:rgba(195,199,154,.1);stroke:var(--ac);stroke-width:1.4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease-out forwards,fillin 1s 1.6s both}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fillin{from{fill:rgba(195,199,154,0)}}
.scan{stroke:rgba(242,194,48,.5);stroke-width:1;animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(360px)}}
.pin{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:pop .5s var(--ease) backwards}
.pin .pulse{fill:none;stroke:var(--ye);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
.pin .dot{fill:var(--ye);stroke:#14110A;stroke-width:1;transition:r .2s}
.pin.sel .dot{fill:#fff}
.pin:focus{outline:none}.pin:focus-visible .dot{stroke:#fff;stroke-width:2}
.pin text{font:600 9px Inter,sans-serif;fill:var(--tx);paint-order:stroke;stroke:#0E100B;stroke-width:2.5px}
/* candle */
.candle{width:44px;height:84px;position:relative;margin:0 auto}
.candle .w{position:absolute;bottom:0;left:8px;width:28px;height:50px;border-radius:5px;background:linear-gradient(90deg,#CFC9B4,#F3EFE0 50%,#BDB7A2)}
.candle .f{position:absolute;bottom:52px;left:13px;width:18px;height:30px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 70%,#fff 0 18%,#FFD76A 40%,#F28A1E 75%,transparent 80%);transform-origin:50% 100%;animation:flame 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px rgba(255,180,60,.8));opacity:0;transition:opacity .6s}
.candle.lit .f{opacity:1}
@keyframes flame{0%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.06,.94) rotate(2deg)}100%{transform:scale(.96,1.08) rotate(-1deg)}}
/* games */
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.hearts span{color:var(--bad);font-size:20px;transition:opacity .3s,transform .3s;display:inline-block}.hearts span.off{opacity:.2;transform:scale(.7)}
.deck{position:relative;height:300px;touch-action:pan-y}
.scard{position:absolute;inset:0;border-radius:22px;border:1px solid var(--ln);background:linear-gradient(160deg,#252A1C,#14160F);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;box-shadow:0 20px 40px -18px #000;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;animation:pop .4s var(--ease)}
.scard .emo{font-size:84px;line-height:1}
.scard .tag{position:absolute;top:16px;padding:6px 10px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;border:2px solid}
.scard .tag.l{left:16px;color:var(--bad);transform:rotate(-10deg)}.scard .tag.r{right:16px;color:var(--ok);transform:rotate(10deg)}
.scard.fly{transition:transform .45s ease-in,opacity .45s}
.toast{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;border-radius:12px;padding:8px 12px}
.toast.ok{background:#1B2A1C;color:#B9E6BB;animation:pop .3s}.toast.no{background:#2C1B18;color:#F6B9AD;animation:shake .35s}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{flex-direction:column;min-height:92px;gap:4px;font-size:12.5px;font-weight:500;padding:8px;border-radius:16px;animation:pop .4s var(--ease) backwards}
.item .e{font-size:30px;line-height:1}
.item.packed{pointer-events:none;transform:translateY(60px) scale(.2);opacity:0;transition:transform .5s var(--ease),opacity .5s}
.item.no{animation:shake .35s;border-color:var(--bad)}
.bag{font-size:46px;line-height:1;display:inline-block}.bag.b{animation:bump .35s}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:900px}
.mc{position:relative;min-height:88px;padding:0;border:0;background:transparent;transform-style:preserve-3d;transition:transform .5s var(--ease)}
.mc.fl{transform:rotateY(180deg)}
.mc i{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;font-style:normal;padding:6px;border:1px solid var(--ln)}
.mc .fr{background:linear-gradient(160deg,#2A2F1F,#171A12);color:var(--ac);font-family:'Ruslan Display',serif;font-size:26px}
.mc .bk{background:var(--sf2);transform:rotateY(180deg);font-size:12.5px;font-weight:600;line-height:1.2}
.mc .bk.num{font-family:Oswald,sans-serif;font-size:28px;color:var(--ye)}
.mc.done .bk{border-color:var(--ok);background:#1B2A1C;animation:bump .4s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.big{font-size:60px;text-align:center;animation:pop .6s var(--ease)}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--sf2);overflow:hidden;position:relative}.steps i:after{content:"";position:absolute;inset:0;background:var(--ye);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}.steps i.on:after{transform:scaleX(1)}
.check{width:88px;height:88px;margin:0 auto;display:block}.check circle{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out forwards}.check path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s .6s ease-out forwards}
.num{width:32px;height:32px;border-radius:50%;background:var(--sf2);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-family:Oswald,sans-serif;color:var(--ye);flex:none}

/* v3 */
#app{background-image:repeating-radial-gradient(circle at 85% -5%,rgba(195,199,154,.045) 0 1px,transparent 1px 16px);background-repeat:no-repeat;background-size:100% 420px}
.hero,.idc{background-image:repeating-radial-gradient(circle at 90% 10%,rgba(195,199,154,.08) 0 1px,transparent 1px 13px),linear-gradient(135deg,#262B1D,#12140E)}
.tile svg{width:42px;height:42px;padding:8px;border-radius:13px;background:rgba(242,194,48,.1);border:1px solid rgba(242,194,48,.28);transition:transform .4s var(--ease)}
.tile:active svg{transform:rotate(-8deg) scale(1.1)}
.sosb{border-color:var(--bad);color:#F6B9AD;background:rgba(238,141,124,.08);justify-content:flex-start}
.idc{border:1px solid rgba(242,194,48,.4);border-radius:18px;padding:16px;position:relative;overflow:hidden;box-shadow:0 18px 40px -22px rgba(242,194,48,.5)}
.idc:before{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-80px}100%{left:120%}}
.idc>*{position:relative}
/* candle */
.cdl{position:relative;width:140px;height:200px;margin:0 auto}
.cdl .wax{position:absolute;bottom:0;left:43px;width:54px;height:112px;border-radius:9px 9px 6px 6px/12px 12px 6px 6px;background:linear-gradient(90deg,#8E8870,#E9E3CE 30%,#FFFDF3 48%,#DAD4BD 68%,#847E67);box-shadow:inset 0 -22px 26px -12px rgba(0,0,0,.55),0 10px 18px -8px #000;transition:box-shadow .8s}
.cdl .wax:before{content:"";position:absolute;top:-7px;left:0;right:0;height:16px;border-radius:50%;background:radial-gradient(ellipse at 50% 60%,#FFF8E0,#CFC7A8 80%)}
.cdl .wax:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 50% 0,rgba(255,170,70,.75),transparent 62%);opacity:0;transition:opacity .9s}
.cdl.lit .wax:after{opacity:1}
.cdl .wax i{position:absolute;top:4px;width:7px;border-radius:0 0 5px 5px;background:linear-gradient(90deg,#F6F1DE,#D5CFB8)}
.cdl .wax i:nth-child(1){left:7px;height:30px}.cdl .wax i:nth-child(2){right:11px;height:19px;width:6px}
.cdl .wick{position:absolute;left:50%;bottom:112px;width:3px;height:15px;margin-left:-1.5px;border-radius:2px;background:linear-gradient(#1b140f,#4a3524);transform:rotate(4deg);transform-origin:bottom}
.cdl.lit .wick{background:linear-gradient(#ff9a3c,#1b140f 55%)}
.cdl .fw{position:absolute;left:50%;bottom:121px;width:30px;height:70px;margin-left:-15px;transform:scale(0);transform-origin:50% 100%;opacity:0;transition:transform .7s var(--ease),opacity .4s}
.cdl.lit .fw{transform:scale(1);opacity:1}
.cdl .flame{position:absolute;inset:0;transform-origin:50% 100%;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(ellipse 34% 16% at 50% 92%,rgba(70,130,255,.95),transparent 100%),radial-gradient(ellipse 30% 42% at 50% 62%,#fff 0 45%,transparent 100%),radial-gradient(ellipse 60% 62% at 50% 60%,#FFE79A 0 30%,#FFB534 58%,rgba(255,112,24,.85) 82%,transparent 100%);filter:blur(.5px) drop-shadow(0 0 16px rgba(255,170,60,.95));animation:fl1 3.1s ease-in-out infinite,fl2 .23s ease-in-out infinite alternate}
@keyframes fl1{0%{transform:rotate(-2deg) scaleY(1)}22%{transform:rotate(2.5deg) scaleY(1.07)}45%{transform:rotate(-1deg) scaleY(.95)}63%{transform:rotate(3deg) scaleY(1.04) skewX(2deg)}82%{transform:rotate(-3deg) scaleY(1.09) skewX(-2deg)}100%{transform:rotate(-2deg) scaleY(1)}}
@keyframes fl2{from{opacity:.93}to{opacity:1}}
.cdl .glow{position:absolute;left:50%;bottom:86px;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,66,.42),rgba(255,140,40,.12) 45%,transparent 68%);opacity:0;transition:opacity .9s;animation:glw 2.3s ease-in-out infinite alternate;pointer-events:none}
.cdl.lit .glow{opacity:1}
@keyframes glw{from{transform:scale(.94)}to{transform:scale(1.06)}}
.cdl .smoke{position:absolute;left:50%;bottom:128px;width:10px;height:44px;margin-left:-5px;border-radius:50%;background:linear-gradient(transparent,rgba(210,210,200,.5));filter:blur(4px);opacity:0}
.cdl.out .smoke{animation:smk 1.8s ease-out}
@keyframes smk{0%{opacity:.8;transform:translateY(0) scaleX(1)}100%{opacity:0;transform:translateY(-70px) scaleX(2.6) rotate(12deg)}}
.card:has(.cdl){overflow:hidden;transition:background 1s,border-color 1s}
.card:has(.cdl.lit){background:radial-gradient(90% 70% at 50% 30%,rgba(255,150,50,.2),#141610 75%);border-color:rgba(255,170,70,.45)}
/* merch */
.prod{padding:10px;gap:8px}.prod svg{display:block;width:100%;height:auto;border-radius:12px;background:radial-gradient(circle at 50% 40%,#2A2F1F,#12140E)}
.prod .sz{display:flex;gap:4px}.prod .sz button{min-height:32px;min-width:0;flex:1;padding:0;font-size:12px;border-radius:8px}.prod .sz button.on{background:var(--ac);color:#14110A;border-color:var(--ac)}
.prod .add{min-height:42px;font-size:13.5px}
.cartn{display:inline-flex;min-width:24px;height:24px;border-radius:12px;background:var(--ye);color:#14110A;align-items:center;justify-content:center;font-size:13px;padding:0 6px}.cartn.b{animation:bump .35s}
.lnk{padding:12px 14px;justify-content:flex-start;text-align:left;font-weight:400}.lnk b{display:block}
.lnk .bi{width:44px;height:44px;border-radius:13px;background:rgba(195,199,154,.1);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;color:var(--ye);flex:none}

/* ---------- LEADERBOARD ---------- */
var LB={db:null,uid:null,rows:[],state:'wait',unsub:null,timer:null,ro:false,pending:false};
function lbInit(){if(!window.claude||!window.claude.use){LB.state='off';return;}
Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){LB.db=r[0];var u=r[1];
if(!LB.db||!u){LB.state='off';rerenderBoard();return;}
return u.id().then(function(id){LB.uid=id;if(!id){LB.state='off';rerenderBoard();return;}
LB.timer=setTimeout(function(){if(LB.state==='wait'){LB.state='slow';rerenderBoard();}},10000);
try{LB.unsub=LB.db.collection('board').orderBy('xp','desc').limit(100).onSnapshot(function(snap){clearTimeout(LB.timer);LB.rows=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,call:String(x.call||'').slice(0,14),city:String(x.city||'').slice(0,24),xp:Math.max(0,Math.min(99999,+x.xp||0))};});LB.state='ok';rerenderBoard();},function(){clearTimeout(LB.timer);LB.state='off';rerenderBoard();});}catch(e){LB.state='off';}
if(S.lbOn)lbPush();});}).catch(function(){LB.state='off';rerenderBoard();});}
function lbPush(){if(!LB.db||!LB.uid||LB.ro||LB.pending)return;var ref=LB.db.doc('board/'+LB.uid);LB.pending=true;
var p=S.lbOn&&S.call?ref.set({call:S.call,city:S.city||'',xp:S.xp,ts:Date.now()}):ref.delete();
p.then(function(){LB.pending=false;},function(e){LB.pending=false;if(e&&e.code==='invalid_argument'){LB.ro=true;rerenderBoard();}});}
var lbLast='';function lbSync(){var k=[S.lbOn,S.call,S.city,S.xp].join('|');if(k!==lbLast){lbLast=k;lbPush();}}
function rerenderBoard(){var el=$('#lb');if(el)el.innerHTML=boardInner();}
function vBoard(){return '<div class="card stack"><div class="tog"><div><b>Показувати мене в рейтингу</b><p class="sm mu">Видно лише позивний'+(S.city?', місто':'')+' і бали.</p></div><button class="sw" role="switch" aria-checked="'+!!S.lbOn+'" aria-label="Показувати мене в рейтингу" data-act="lbtog"></button></div>'+(S.lbOn&&!S.call?'<div class="msg no" role="alert">Спершу збережи позивний у жетоні вище.</div>':'')+'</div>'+
'<div class="seg" role="tablist"><button role="tab" aria-selected="'+(ui.lbf!=='city')+'" class="'+(ui.lbf!=='city'?'on':'')+'" data-act="lbf" data-f="all">Уся Україна</button><button role="tab" aria-selected="'+(ui.lbf==='city')+'" class="'+(ui.lbf==='city'?'on':'')+'" data-act="lbf" data-f="city"'+(S.city?'':' disabled')+'>'+(S.city?esc(S.city):'Моє місто')+'</button></div><div id="lb">'+boardInner()+'</div>';}
function boardInner(){
if(LB.state==='off')return '<div class="card stack"><h3>Спільний рейтинг недоступний тут</h3><p class="sm mu">Рейтинг між дітьми працює, коли застосунок відкрито через Claude з входом в обліковий запис. Твої бали все одно рахуються.</p>'+meRow()+'</div>';
if(LB.state==='wait')return '<p class="sm mu" role="status">Завантаження рейтингу…</p>';
var rows=LB.rows.filter(function(r){return r.call&&(ui.lbf!=='city'||(S.city&&r.city.toLowerCase()===S.city.toLowerCase()));});
var h=(LB.state==='slow'?'<p class="sm mu">Рейтинг поки не відповідає, дані можуть бути неповні.</p>':'')+(LB.ro?'<div class="msg no">У тебе немає дозволу додавати себе до рейтингу в цьому застосунку. Можна лише переглядати.</div>':'');
if(!rows.length)return h+'<div class="card stack" style="text-align:center"><div class="big" aria-hidden="true">🏅</div><h3>Рейтинг ще порожній</h3><p class="sm mu">Увімкни участь вище і стань першим захисником у списку.</p></div>';
return h+'<ol class="lb" style="list-style:none;margin:0;padding:0">'+rows.slice(0,50).map(function(r,i){var me=r.id===LB.uid;return '<li class="lbr'+(me?' me':'')+'" style="animation-delay:'+(i*.04)+'s"><span class="pl">'+(i+1)+'</span><span><b>«'+esc(r.call)+'»'+(me?' · це ти':'')+'</b><span class="sm mu">'+(r.city?esc(r.city)+' · ':'')+rankOf(r.xp)+'</span></span><span class="xp">'+r.xp+'</span></li>';}).join('')+'</ol>';}
function rankOf(x){var n=RANKS[0][1];for(var i=0;i<RANKS.length;i++)if(x>=RANKS[i][0])n=RANKS[i][1];return n;}
function meRow(){return '<div class="lbr me"><span class="pl">—</span><span><b>«'+esc(S.call||'Без позивного')+'»</b><span class="sm mu">'+(S.city?esc(S.city)+' · ':'')+rankOf(S.xp)+'</span></span><span class="xp">'+S.xp+'</span></div>';}

else if(a==='candle'){S.candle=!S.candle;save();$('#cnd').className='cdl'+(S.candle?' lit':' out');$('#cndt').textContent=S.candle?'Свічка пам\'яті горить. Дякуємо, що пам\'ятаєте.':'Запаліть свічку в пам\'ять про полеглих.';b.textContent=S.candle?'Погасити свічку':'Запалити свічку';b.className=S.candle?'':'pri';}

});
