    ctx.beginPath();
    ctx.ellipse(len + 6, 0, 7, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFrame(ctx) {
    var gg = goldGrad(ctx, 0, 0, W, H);

    // зовнішня рамка
    ctx.save();
    ctx.strokeStyle = gg;
    ctx.lineWidth = 6;
    ctx.strokeRect(26, 26, W - 52, H - 52);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(38, 38, W - 76, H - 76);

    // смуга між рамками — ланцюжок ромбиків (вишиванковий бордюр)
    var bx0 = 38, by0 = 38, bx1 = W - 38, by1 = H - 38, inset = 70;
    ctx.fillStyle = 'rgba(242,194,48,0.55)';
    var step = 18;
    function diamond(x, y, s) {
      ctx.beginPath();
      ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y);
      ctx.closePath(); ctx.fill();
    }
    var mid = (38 + 58) / 2;
    for (var x = bx0 + inset; x <= bx1 - inset; x += step) {
      var big = Math.round((x - bx0) / step) % 3 === 0;
      diamond(x, mid, big ? 4.5 : 2.4);
      diamond(x, H - mid, big ? 4.5 : 2.4);
    }
    for (var y = by0 + inset; y <= by1 - inset; y += step) {
      var big2 = Math.round((y - by0) / step) % 3 === 0;
      diamond(mid, y, big2 ? 4.5 : 2.4);
      diamond(W - mid, y, big2 ? 4.5 : 2.4);
    }

    // внутрішня рамка
    ctx.strokeStyle = gg;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(58, 58, W - 116, H - 116);
    ctx.strokeStyle = 'rgba(195,199,154,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(66, 66, W - 132, H - 132);
    ctx.restore();

    // кутові орнаменти
    var corners = [[1, 1, 0], [-1, 1, W], [1, -1, 0], [-1, -1, W]];
    for (var i = 0; i < 4; i++) {
      var sx = corners[i][0], sy = corners[i][1];
      var ox = sx > 0 ? 0 : W, oy = sy > 0 ? 0 : H;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(sx, sy);
      // підкладка під зірку
      ctx.fillStyle = C.bg0;
      ctx.beginPath();
      ctx.moveTo(48, 20); ctx.lineTo(76, 48); ctx.lineTo(48, 76); ctx.lineTo(20, 48);
      ctx.closePath();
      ctx.fill();
      // ромб-оправа
      ctx.strokeStyle = gg;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(48, 6); ctx.lineTo(90, 48); ctx.lineTo(48, 90); ctx.lineTo(6, 48);
      ctx.closePath();
      ctx.fillStyle = C.bg0;
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // вишиванкова зірка (не дзеркалимо — вона симетрична)
      var cx = sx > 0 ? 48 : W - 48, cy = sy > 0 ? 48 : H - 48;
      drawStar(ctx, cx, cy, 5.2, C.gold);

      // лаврові гілочки вздовж сторін
      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(sx, sy);
      ctx.strokeStyle = 'rgba(242,194,48,0.8)';
      ctx.fillStyle = 'rgba(242,194,48,0.8)';
      ctx.lineWidth = 1.5;
      ctx.save();
      ctx.translate(100, 94);
      drawLaurelSprig(ctx, 150, 1);
      ctx.restore();
      ctx.save();
      ctx.translate(94, 100);
      ctx.rotate(Math.PI / 2);
      drawLaurelSprig(ctx, 150, -1);
      ctx.restore();
      ctx.restore();
    }
  }

  /* ---------------- верхній блок ---------------- */

  function drawHeader(ctx, emblem) {
    var cy = 132, R = 68;
    // ореол під емблему
    var halo = ctx.createRadialGradient(W / 2, cy, R * 0.6, W / 2, cy, R * 1.55);
    halo.addColorStop(0, 'rgba(195,199,154,0.30)');
    halo.addColorStop(1, 'rgba(195,199,154,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(W / 2, cy, R * 1.6, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.strokeStyle = goldGrad(ctx, W / 2 - R, cy - R, W / 2 + R, cy + R);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, cy, R + 8, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([2, 6]);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(W / 2, cy, R + 16, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    if (emblem) {
      var s = R * 2 * 1.06;
      ctx.drawImage(emblem, W / 2 - s / 2, cy - s / 2, s, s);
    } else {
      // запасний варіант — щит із зіркою
      ctx.fillStyle = 'rgba(30,33,26,0.9)';
      ctx.beginPath(); ctx.arc(W / 2, cy, R, 0, Math.PI * 2); ctx.fill();
      drawShield(ctx, W / 2, cy, 46, goldGrad(ctx, W / 2 - 40, cy - 50, W / 2 + 40, cy + 50), C.bg0);
    }

    // вордмарк «АРТАН» з декоративними лініями
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    font(ctx, 400, 34, F_WORD);
    ctx.fillStyle = C.olive;
    var ww = spacedText(ctx, 'АРТАН', W / 2, 266, 14);
    ctx.strokeStyle = 'rgba(195,199,154,0.6)';
    ctx.lineWidth = 1.5;
    var lx = ww / 2 + 26;
    ctx.beginPath();
    ctx.moveTo(W / 2 - lx, 254); ctx.lineTo(W / 2 - lx - 120, 254);
    ctx.moveTo(W / 2 + lx, 254); ctx.lineTo(W / 2 + lx + 120, 254);
    ctx.stroke();
    ctx.fillStyle = C.olive;
    [-1, 1].forEach(function (s) {
      var x = W / 2 + s * (lx - 8);
      ctx.beginPath();
      ctx.moveTo(x, 249); ctx.lineTo(x + 5, 254); ctx.lineTo(x, 259); ctx.lineTo(x - 5, 254);
      ctx.closePath(); ctx.fill();
    });

    // заголовок
    font(ctx, 600, 72, F_DISPLAY);
    var title = 'ДИПЛОМ ЗАХИСНИКА';
    var tw = spacedWidth(ctx, title, 6);
    var size = 72;
    while (tw > 1100 && size > 50) { size -= 2; font(ctx, 600, size, F_DISPLAY); tw = spacedWidth(ctx, title, 6); }
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = goldGrad(ctx, 0, 284, 0, 344);
    spacedText(ctx, title, W / 2, 342, 6);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,226,122,0.35)';
    ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(0,0,0,0)';
  }

  /* ---------------- щит / печатка ---------------- */

  function starPath(ctx, cx, cy, ro, ri, n) {
    ctx.beginPath();
    for (var i = 0; i < n * 2; i++) {
      var r = i % 2 ? ri : ro, a = -Math.PI / 2 + i * Math.PI / n;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function shieldPath(ctx, cx, cy, h) {
    var w = h * 0.8;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy - h / 2);
    ctx.lineTo(cx + w / 2, cy - h / 2);
    ctx.lineTo(cx + w / 2, cy + h * 0.05);
    ctx.quadraticCurveTo(cx + w / 2, cy + h * 0.38, cx, cy + h / 2);
    ctx.quadraticCurveTo(cx - w / 2, cy + h * 0.38, cx - w / 2, cy + h * 0.05);
    ctx.closePath();
  }

  function drawShield(ctx, cx, cy, h, fill, starFill) {
    shieldPath(ctx, cx, cy, h);
    ctx.fillStyle = fill;
    ctx.fill();
    starPath(ctx, cx, cy - h * 0.03, h * 0.28, h * 0.12, 5);
    ctx.fillStyle = starFill;
    ctx.fill();
  }

  function drawSeal(ctx, cx, cy) {
    var R = 80;
    // стрічки під печаткою
    ctx.save();
    [-1, 1].forEach(function (s) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 18, cy + 40);
      ctx.lineTo(cx + s * 70, cy + 80);
      ctx.lineTo(cx + s * 52, cy + 80);
      ctx.lineTo(cx + s * 50, cy + 98);
      ctx.lineTo(cx + s * -2, cy + 52);
      ctx.closePath();
      var rb = ctx.createLinearGradient(cx, cy + 40, cx + s * 60, cy + 136);
      rb.addColorStop(0, '#5E6249');
      rb.addColorStop(1, '#3A3D2C');
      ctx.fillStyle = rb;
      ctx.fill();
    });
    ctx.restore();
    ctx.save();
    // тінь
    ctx.shadowColor = 'rgba(0,0,0,0.65)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 8;
    // хвилястий «восковий» край
    ctx.beginPath();
    var n = 36;
    for (var i = 0; i <= n * 4; i++) {
      var a = i / (n * 4) * Math.PI * 2;
      var r = R + 5 * Math.sin(a * n) + 1.5 * Math.sin(a * 7);
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    var rg = ctx.createRadialGradient(cx - 30, cy - 35, 10, cx, cy, R + 8);
    rg.addColorStop(0, C.goldHi);
    rg.addColorStop(0.55, C.gold);
    rg.addColorStop(1, '#8F6A07');
    ctx.fillStyle = rg;
    ctx.fill();
    ctx.restore();

    // кільця
    ctx.strokeStyle = 'rgba(90,64,4,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R - 10, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cx, cy, R - 40, 0, Math.PI * 2); ctx.stroke();

    // текст по колу
    ctx.save();
    ctx.fillStyle = '#5A4004';
    font(ctx, 600, 15, F_DISPLAY);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var txt = 'ШКОЛА ЗАХИСНИКА';
    var rText = R - 24;
    var sp = 3;
    var total = spacedWidth(ctx, txt, sp);
    var arc = total / rText;
    var a0 = -Math.PI / 2 - arc / 2;
    var acc = 0;
    for (var k = 0; k < txt.length; k++) {
      var ch = txt.charAt(k), cw = ctx.measureText(ch).width;
      var ang = a0 + (acc + cw / 2) / rText;
      ctx.save();
      ctx.translate(cx + Math.cos(ang) * rText, cy + Math.sin(ang) * rText);
      ctx.rotate(ang + Math.PI / 2);
      ctx.fillText(ch, 0, 0);
      ctx.restore();
      acc += cw + sp;
    }
    // нижня дуга — зірочки й «АРТАН»
    var bottom = 'АРТАН';
    font(ctx, 600, 14, F_DISPLAY);
    var bw = spacedWidth(ctx, bottom, 4);
    var barc = bw / rText;
    var b0 = Math.PI / 2 + barc / 2;
    acc = 0;
    for (var m = 0; m < bottom.length; m++) {
      var ch2 = bottom.charAt(m), cw2 = ctx.measureText(ch2).width;
      var ang2 = b0 - (acc + cw2 / 2) / rText;
      ctx.save();
      ctx.translate(cx + Math.cos(ang2) * rText, cy + Math.sin(ang2) * rText);
      ctx.rotate(ang2 - Math.PI / 2);
      ctx.fillText(ch2, 0, 0);
      ctx.restore();
      acc += cw2 + 4;
    }
    // зірочки-роздільники
    [Math.PI / 2 + barc / 2 + 0.28, Math.PI / 2 - barc / 2 - 0.28].forEach(function (a) {
      starPath(ctx, cx + Math.cos(a) * rText, cy + Math.sin(a) * rText, 5, 2.2, 5);
      ctx.fill();
    });
    ctx.restore();

    // щит зі зіркою в центрі
    shieldPath(ctx, cx, cy, 58);
    ctx.fillStyle = '#6E5205';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,236,160,0.7)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    starPath(ctx, cx, cy - 3, 18, 7.5, 5);
    var sg = ctx.createLinearGradient(cx, cy - 20, cx, cy + 16);
    sg.addColorStop(0, '#FFF2B8');
    sg.addColorStop(1, C.gold);
    ctx.fillStyle = sg;
    ctx.fill();

    // відблиск
    var hl = ctx.createRadialGradient(cx - 35, cy - 45, 2, cx - 35, cy - 45, 60);
    hl.addColorStop(0, 'rgba(255,255,240,0.35)');
    hl.addColorStop(1, 'rgba(255,255,240,0)');
    ctx.fillStyle = hl;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

  }

  /* ---------------- основний текст ---------------- */

  function drawBody(ctx, o) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    font(ctx, 'italic 400', 26, F_SERIF);
    ctx.fillStyle = C.muted;
    ctx.fillText('Цим засвідчується, що', W / 2, 392);

    var isCall = o.mode === 'call';
    var raw = String(o.name || '').replace(/\s+/g, ' ').trim() || (isCall ? 'Захисник' : 'Юний захисник');
    if (raw.length > 48) raw = raw.slice(0, 47) + '…';
    var name = isCall ? '«' + raw + '»' : raw;

    var nameY = 476, maxW = 1240;
    var size = fitSize(ctx, name, 600, F_DISPLAY, 88, 40, maxW, 0.01);
    var nw = spacedWidth(ctx, name, size * 0.01);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = C.text;
    spacedText(ctx, name, W / 2, nameY, size * 0.01);
    ctx.restore();

    // підкреслення-розчерк
    var uw = Math.max(380, Math.min(nw + 80, 1300));
    var ug = ctx.createLinearGradient(W / 2 - uw / 2, 0, W / 2 + uw / 2, 0);
    ug.addColorStop(0, 'rgba(242,194,48,0)');
    ug.addColorStop(0.2, 'rgba(242,194,48,0.9)');
    ug.addColorStop(0.8, 'rgba(242,194,48,0.9)');
    ug.addColorStop(1, 'rgba(242,194,48,0)');
    ctx.strokeStyle = ug;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W / 2 - uw / 2, nameY + 20); ctx.lineTo(W / 2 + uw / 2, nameY + 20); ctx.stroke();
    ctx.fillStyle = C.gold;
    ctx.beginPath();
    ctx.moveTo(W / 2, nameY + 13); ctx.lineTo(W / 2 + 7, nameY + 20); ctx.lineTo(W / 2, nameY + 27); ctx.lineTo(W / 2 - 7, nameY + 20);
    ctx.closePath(); ctx.fill();

    if (isCall) {
      // підпис «позивний» на лінії
      font(ctx, 500, 15, F_BODY);
      var cap = 'ПОЗИВНИЙ';
      var cw = spacedWidth(ctx, cap, 4) + 28;
      ctx.fillStyle = '#16180F';
      roundRect(ctx, W / 2 - cw / 2, nameY + 32, cw, 26, 13);
      ctx.fill();
      ctx.strokeStyle = 'rgba(195,199,154,0.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = C.olive;
      ctx.textBaseline = 'middle';
      spacedText(ctx, cap, W / 2, nameY + 46, 4);
      ctx.textBaseline = 'alphabetic';
    }

    var bodyY = isCall ? 570 : 548;
    font(ctx, 400, 24, F_BODY);
    ctx.fillStyle = C.text;
    var body = 'успішно пройшов(-ла) навчання у Школі захисника та опанував(-ла) навички безпеки';
    var lines = wrapLines(ctx, body, 1200);
    for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], W / 2, bodyY + i * 32);
    return bodyY + (lines.length - 1) * 32;
  }

  var BADGE_H = 78;

  function drawBadges(ctx, o, top) {
    var items = [
      { label: 'ЗВАННЯ', value: String(o.rank || 'Новобранець'), icon: 'star' },
      { label: 'БАЛИ', value: fmtXp(o.xp) + ' XP', icon: 'bolt' }
    ];
    var city = String(o.city || '').trim();
    if (city) items.push({ label: 'МІСТО', value: city, icon: 'pin' });

    var bw = items.length > 2 ? 372 : 400, bh = BADGE_H, gap = 30;
    var total = items.length * bw + (items.length - 1) * gap;
    var x = W / 2 - total / 2;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var bx = x + i * (bw + gap);
      var bg = ctx.createLinearGradient(0, top, 0, top + bh);
      bg.addColorStop(0, 'rgba(46,50,38,0.92)');
      bg.addColorStop(1, 'rgba(22,24,18,0.92)');
      roundRect(ctx, bx, top, bw, bh, 18);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(242,194,48,0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // іконка в колі
      var icx = bx + 44, icy = top + bh / 2;
      ctx.beginPath(); ctx.arc(icx, icy, 25, 0, Math.PI * 2);
      ctx.fillStyle = goldGrad(ctx, icx - 25, icy - 25, icx + 25, icy + 25);
      ctx.fill();
      ctx.fillStyle = C.bg0;
      ctx.strokeStyle = C.bg0;
      drawIcon(ctx, it.icon, icx, icy);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      var maxW = bw - 84 - 18;
      var sz = fitSize(ctx, it.value, 600, F_DISPLAY, 30, 18, maxW, 0);
      var twoLine = !(sz >= 22 || it.value.indexOf(' ') < 0);
      font(ctx, 600, 14, F_BODY);
      ctx.fillStyle = C.muted;
      var lx = bx + 84;
      // розрядка вручну
      var cx = lx;
      for (var k = 0; k < it.label.length; k++) {
        ctx.fillText(it.label.charAt(k), cx, top + (twoLine ? 24 : 30));
        cx += ctx.measureText(it.label.charAt(k)).width + 2.5;
      }
      ctx.fillStyle = it.icon === 'bolt' ? C.gold : C.text;
      fitSize(ctx, it.value, 600, F_DISPLAY, 30, 18, maxW, 0);
      if (!twoLine) {
        ctx.fillText(ellipsize(ctx, it.value, maxW), lx, top + 62);
      } else {
        // довге значення — у два рядки
        font(ctx, 600, 19, F_DISPLAY);
        var vl = wrapLines(ctx, it.value, maxW);
        var l2 = vl.slice(1).join(' ');
        ctx.fillText(ellipsize(ctx, vl[0], maxW), lx, top + 46);
        ctx.fillText(ellipsize(ctx, l2, maxW), lx, top + 67);
      }
    }
    ctx.textAlign = 'center';
    return top + bh;
  }

  function drawIcon(ctx, kind, cx, cy) {
    if (kind === 'star') {
      starPath(ctx, cx, cy + 1, 14, 6, 5);
      ctx.fill();
    } else if (kind === 'bolt') {
      ctx.beginPath();
      ctx.moveTo(cx + 3, cy - 15); ctx.lineTo(cx - 9, cy + 2); ctx.lineTo(cx - 1, cy + 2);
      ctx.lineTo(cx - 4, cy + 15); ctx.lineTo(cx + 9, cy - 3); ctx.lineTo(cx + 1, cy - 3);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy - 4, 9, Math.PI * 0.85, Math.PI * 2.15);
      ctx.lineTo(cx, cy + 14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.gold;
      ctx.beginPath(); ctx.arc(cx, cy - 4, 3.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  var CHIP = { h: 40, rowGap: 10, maxRowW: 1300, gap: 12, maxRows: 2, padL: 40, padR: 20, maxText: 520 };

  // розкладка чипів місій (не малює) -> { rows, rw } або null, якщо місій немає
  function layoutMissions(ctx, missions) {
    var list = [];
    for (var i = 0; i < (missions || []).length; i++) {
      var m = String(missions[i] == null ? '' : missions[i]).replace(/\s+/g, ' ').trim();
      if (m) list.push(m);
    }
    if (!list.length) return null;
    font(ctx, 500, 19, F_BODY);
    var chips = list.map(function (t) {
      var s = ellipsize(ctx, t, CHIP.maxText);
      return { text: s, w: ctx.measureText(s).width + CHIP.padL + CHIP.padR };
    });
    function layout(chs) {
      var rows = [[]], rw = [0];
      for (var j = 0; j < chs.length; j++) {
        var r = rows.length - 1, add = (rows[r].length ? CHIP.gap : 0) + chs[j].w;
        if (rw[r] + add > CHIP.maxRowW && rows[r].length) { rows.push([]); rw.push(0); r++; add = chs[j].w; }
        rows[r].push(chs[j]); rw[r] += add;
      }
      return { rows: rows, rw: rw };
    }
    var lay = layout(chips);
    if (lay.rows.length > CHIP.maxRows) {
      // прибираємо хвіст і додаємо чип «+ ще N»
      var keep = chips.length;
      while (keep > 0) {
        keep--;
        var more = { text: '+ ще ' + (chips.length - keep), w: 0, more: true };
        more.w = ctx.measureText(more.text).width + 36;
        lay = layout(chips.slice(0, keep).concat([more]));
        if (lay.rows.length <= CHIP.maxRows) break;
      }
    }
    return lay;
  }

  function missionsHeight(lay) {
    return 36 + (lay ? lay.rows.length * CHIP.h + (lay.rows.length - 1) * CHIP.rowGap : 40);
  }

  function drawMissions(ctx, lay, top) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    font(ctx, 600, 16, F_BODY);
    ctx.fillStyle = C.olive;
    var hw = spacedText(ctx, 'ОПАНОВАНІ МІСІЇ', W / 2, top + 22, 3);
    ctx.strokeStyle = 'rgba(195,199,154,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2 - hw / 2 - 18, top + 16); ctx.lineTo(W / 2 - hw / 2 - 150, top + 16);
    ctx.moveTo(W / 2 + hw / 2 + 18, top + 16); ctx.lineTo(W / 2 + hw / 2 + 150, top + 16);
    ctx.stroke();

    var rowTop = top + 36, chipH = CHIP.h, rowGap = CHIP.rowGap, gap = CHIP.gap, padL = CHIP.padL;
    if (!lay) {
      font(ctx, 'italic 400', 26, F_SERIF);
      ctx.fillStyle = C.gold;
      ctx.fillText('Перші кроки зроблено!', W / 2, rowTop + 28);
      return;
    }
    font(ctx, 500, 19, F_BODY);

    for (var r = 0; r < lay.rows.length; r++) {
      var row = lay.rows[r];
      var x = W / 2 - lay.rw[r] / 2, y = rowTop + r * (chipH + rowGap);
      for (var c = 0; c < row.length; c++) {
        var ch = row[c];
        roundRect(ctx, x, y, ch.w, chipH, chipH / 2);
        if (ch.more) {
          ctx.fillStyle = 'rgba(242,194,48,0.12)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(242,194,48,0.7)';
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = C.gold;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(ch.text, x + ch.w / 2, y + chipH / 2 + 1);
        } else {
          var cg = ctx.createLinearGradient(0, y, 0, y + chipH);
          cg.addColorStop(0, 'rgba(195,199,154,0.20)');
          cg.addColorStop(1, 'rgba(195,199,154,0.08)');
          ctx.fillStyle = cg;
          ctx.fill();
          ctx.strokeStyle = 'rgba(195,199,154,0.55)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          // галочка
          var gx = x + 21, gy = y + chipH / 2;
          ctx.beginPath(); ctx.arc(gx, gy, 10, 0, Math.PI * 2);
          ctx.fillStyle = C.gold; ctx.fill();
          ctx.strokeStyle = C.bg0; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.beginPath(); ctx.moveTo(gx - 4.5, gy + 0.5); ctx.lineTo(gx - 1, gy + 4); ctx.lineTo(gx + 5, gy - 3.5); ctx.stroke();
          ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
          ctx.fillStyle = C.text;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(ch.text, x + padL, y + chipH / 2 + 1);
        }
        x += ch.w + gap;
      }
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
  }

  function drawFooter(ctx, o) {
    var lineY = 958, colW = 340;
    var cols = [
      { cx: 330, value: fmtDate(o.date), label: 'Дата' },
      { cx: W - 330, value: '№ ' + (String(o.serial || '').trim() || '—'), label: 'Номер диплома' }
    ];
    for (var i = 0; i < cols.length; i++) {
      var c = cols[i];
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      fitSize(ctx, c.value, 500, F_DISPLAY, 32, 18, colW - 20, 0);
      ctx.fillStyle = C.text;
      ctx.fillText(ellipsize(ctx, c.value, colW - 20), c.cx, lineY - 14);
      ctx.strokeStyle = goldGrad(ctx, c.cx - colW / 2, 0, c.cx + colW / 2, 0);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(c.cx - colW / 2, lineY); ctx.lineTo(c.cx + colW / 2, lineY); ctx.stroke();
      font(ctx, 500, 15, F_BODY);
      ctx.fillStyle = C.muted;
      spacedText(ctx, c.label.toUpperCase(), c.cx, lineY + 26, 2.5);
    }

    drawSeal(ctx, W / 2, 928);

    ctx.textAlign = 'center';
    font(ctx, 'italic 400', 20, F_SERIF);
    ctx.fillStyle = C.olive;
    ctx.fillText('Знаємо. Знаходимо. Знищуємо.', W / 2, 1034);
    font(ctx, 400, 13, F_BODY);
    ctx.fillStyle = 'rgba(169,173,157,0.75)';
    ctx.fillText('Тестова версія застосунку «Артан»', W / 2, 1056);
  }

  /* ---------------- публічний API ---------------- */

  function render(opts) {
    var o = opts || {};
    return Promise.all([loadFonts(), loadEmblem()]).then(function (r) {
      var emblem = r[1];
      var canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');
      var rand = rng(o.serial || o.name);

      drawBackground(ctx, rand);
      drawFrame(ctx);
      drawHeader(ctx, emblem);
      drawFooter(ctx, o);

      // середній блок центруємо по вертикалі у вільному просторі
      var lay = layoutMissions(ctx, o.missions);
      var blockEnd = (o.mode === 'call' ? 570 : 548) + 26 + BADGE_H + 16 + missionsHeight(lay);
      var dy = Math.max(0, Math.min(44, (830 - blockEnd) / 2));
      ctx.save();
      ctx.translate(0, Math.round(dy));
      var y = drawBody(ctx, o);
      y = drawBadges(ctx, o, y + 26);
      drawMissions(ctx, lay, y + 16);
      ctx.restore();
      return canvas;
    });
  }

  window.ArtanDiploma = { render: render };
})();

</script>
<script>
/* Extension registry: files in js/ext/ register games, missions and views here. */
window.ARTAN_EXT={games:[],missions:[],views:[]};
window.ArtanExt={game:function(g){ARTAN_EXT.games.push(g);},mission:function(m){ARTAN_EXT.missions.push(m);},view:function(v){ARTAN_EXT.views.push(v);}};
</script>
<script>/* js/ext/missions.js */
/* Artan extension: additional "Школа захисника" missions.
   Format matches the built-in MISSIONS: 3 tips, 3 questions [text, [a,b,c], correctIndex].
   Facts used here are listed with sources in content/fact-check.md. */
(function(){
  if(typeof ArtanExt==='undefined'||!ArtanExt||!ArtanExt.mission){return;}
  function add(m){ArtanExt.mission(m);}

  /* ---------- 6+ ---------- */
  add({id:'fire',min:6,t:'Пожежна безпека',
    tips:[
      'Побачив вогонь або дим — одразу клич дорослих і телефонуй 101 або 112.',
      'У диму пригнися і йди до виходу: внизу повітря чистіше. Не ховайся під ліжко чи в шафу.',
      'Під час пожежі не їдь ліфтом — спускайся сходами.'],
    q:[
      ['У квартирі з’явився дим. Що робиш?',['Ховаюся під ліжко','Пригинаюся, йду до виходу і кличу дорослих','Відчиняю всі шафи'],1],
      ['Номер рятувальників у разі пожежі?',['101','102','104'],0],
      ['У будинку пожежа. Як спускатися вниз?',['Ліфтом, так швидше','Через вікно','Сходами'],2]]});

  add({id:'water',min:6,t:'Вода і лід',
    tips:[
      'Купайся тільки в дозволених місцях і лише поруч із дорослими.',
      'Не виходь на лід без дорослих. Рятувальники кажуть: лід тонший за 7 см не витримає навіть одну людину.',
      'Хтось тоне чи провалився під лід — не лізь до нього. Клич дорослих, телефонуй 101 або 112, подай палицю чи шарф здалеку.'],

function mb(n){if(n==null)return '';if(n<1024*1024)return Math.max(1,Math.round(n/1024))+' КБ';if(n<1024*1024*1024)return (n/1048576).toFixed(n<10485760?1:0).replace('.',',')+' МБ';return (n/1073741824).toFixed(1).replace('.',',')+' ГБ';}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function shown(){return M.filter==='all'?items:items.filter(function(x){return x.album===M.filter;});}
function urlOf(it){if(!urls[it.id]){try{urls[it.id]=URL.createObjectURL(it.blob);}catch(e){urls[it.id]='';}}return urls[it.id];}
function revokeAll(){for(var k in urls){try{if(urls[k])URL.revokeObjectURL(urls[k]);}catch(e){}}urls={};}

/* ---------- IndexedDB ---------- */
function openDb(cb){
  if(db){cb();return;}
  if(dbState==='off'){cb();return;}
  try{
    var rq=indexedDB.open(DBN,1);
    rq.onupgradeneeded=function(){try{rq.result.createObjectStore(ST,{keyPath:'id'});}catch(e){}};
    rq.onsuccess=function(){db=rq.result;dbState='ok';cb();};
    rq.onerror=function(){dbState='off';cb();};
    rq.onblocked=function(){dbState='off';cb();};
  }catch(e){dbState='off';cb();}
}
function loadAll(cb){
  if(!db){cb();return;}
  try{
    var out=[],cur=db.transaction(ST).objectStore(ST).openCursor();
    cur.onsuccess=function(){var c=cur.result;if(c){out.push(c.value);c.continue();}else{out.sort(function(a,b){return b.ts-a.ts;});items=out;cb();}};
    cur.onerror=function(){cb();};
  }catch(e){cb();}
}
function dbPut(rec,ok,fail){
  if(!db){ok();return;}
  try{var tx=db.transaction(ST,'readwrite');tx.objectStore(ST).put(rec);tx.oncomplete=function(){ok();};tx.onerror=function(){fail(tx.error);};tx.onabort=function(){fail(tx.error);};}
  catch(e){fail(e);}
}
function dbDel(id){if(!db)return;try{db.transaction(ST,'readwrite').objectStore(ST).delete(id);}catch(e){}}

function estimate(){
  if(!(navigator.storage&&navigator.storage.estimate))return;
  try{navigator.storage.estimate().then(function(e){M.est=e;var el=root&&root.querySelector('#x-media-use');if(el)el.innerHTML=useText();},function(){});}catch(e){}
}
function useText(){
  var mine=0;items.forEach(function(x){mine+=x.size||0;});
  var t='У медіатеці: '+items.length+' '+plural(items.length,'файл','файли','файлів')+(items.length?' · '+mb(mine):'');
  if(M.est&&M.est.quota){var p=Math.min(100,Math.round((M.est.usage||0)/M.est.quota*100));
    t+='<br>Сховище браузера: '+mb(M.est.usage||0)+' з '+mb(M.est.quota)+' ('+p+'%)';}
  return t;
}
function plural(n,a,b,c){var m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<12||m100>14))return b;return c;}

/* ---------- views ---------- */
function headHtml(){

  '<p class="sm mu">Твої фото й відео про підрозділ, простори, вишколи та родину. Файли зберігаються лише на цьому пристрої й нікуди не надсилаються.</p></header>'+
  '<div id="x-media-body" class="stack"><p class="sm mu" role="status">Відкриваю медіатеку…</p></div>'+
  videosHtml();
}
function videosHtml(){
  return '<section class="stack" aria-labelledby="x-media-vh"><div class="row sb"><h2 id="x-media-vh">Відео підрозділу</h2><span class="badge off">офіційні</span></div>'+
  '<p class="sm mu">Тут з\'являться офіційні відео «Артану». Посилання додамо після перевірки, а поки дивіться відео на офіційних сторінках.</p>'+
  VIDEOS.map(function(v){return '<div class="card vid" role="group" aria-label="'+esc(v[0])+'"><span class="th">'+ic('ply')+'</span><span><b style="display:block">'+esc(v[0])+'</b><span class="sm mu">'+esc(v[1])+' · [ПОСИЛАННЯ]</span></span></div>';}).join('')+
  '<a class="btn" href="#social">'+ic('soc')+'Офіційні сторінки й відео '+ic('arr')+'</a></section>';

function bodyHtml(){
  var h='';
  if(dbState==='off')h+='<div class="msg no" role="status">Сховище браузера недоступне. Файли буде видно лише до закриття сторінки.</div>';
  h+='<div class="card stack x-media-up"><div class="row sb"><div><p class="ey">Додати</p><h3>Фото чи відео</h3></div><span style="color:var(--ye)">'+ic('cam')+'</span></div>'+
  '<div class="grid2"><div><label for="x-media-alb">Альбом</label><select id="x-media-alb" class="x-media-sel">'+ALBUMS.map(function(a){return '<option'+(a===M.upAlbum?' selected':'')+'>'+esc(a)+'</option>';}).join('')+'</select></div>'+
  '<div><label for="x-media-cap">Підпис</label><input id="x-media-cap" class="x-media-in" type="text" maxlength="80" placeholder="Необов\'язково"></div></div>'+
  '<label for="x-media-file" class="btn pri" style="margin:0;color:#14110A;font-size:15px"'+(M.busy?' aria-disabled="true"':'')+'>'+ic('cam')+(M.busy?'Зберігаю…':'Обрати файли')+'</label>'+
  '<input id="x-media-file" type="file" accept="image/*,video/*" multiple'+(M.busy?' disabled':'')+'>'+
  '<p class="sm mu" id="x-media-use" aria-live="polite">'+useText()+'</p>'+
  (M.msg?'<div class="msg '+(M.ok?'ok':'no')+'" role="status">'+M.msg+'</div>':'')+
  '<p class="sm mu">Не публікуй у мережі фото з бійцями, технікою чи позиціями без дозволу: обличчя, номери й геолокація допомагають ворогу.</p></div>';

  if(!items.length){
    return h+'<div class="card stack x-media-empty"><div class="big" aria-hidden="true">📷</div><h3>Тут поки порожньо</h3>'+
    '<ol><li>Обери альбом: «Операції», «Простори», «Вишколи», «Пам\'ять», «Родина» чи «Інше».</li>'+
    '<li>За бажанням додай підпис.</li><li>Натисни «Обрати файли» і вибери фото або відео з телефона.</li></ol>'+
    '<p class="sm mu">Натисни на файл, щоб відкрити на весь екран. Гортай свайпом або стрілками.</p></div>';
  }
  var cnt={};items.forEach(function(x){cnt[x.album]=(cnt[x.album]||0)+1;});
  h+='<div class="x-media-chips" role="toolbar" aria-label="Фільтр за альбомом"><button class="chip'+(M.filter==='all'?' on':'')+'" data-x="flt" data-a="all" aria-pressed="'+(M.filter==='all')+'">Усі<i>'+items.length+'</i></button>'+
  ALBUMS.map(function(a){var on=M.filter===a;return '<button class="chip'+(on?' on':'')+'" data-x="flt" data-a="'+esc(a)+'" aria-pressed="'+on+'">'+esc(a)+'<i>'+(cnt[a]||0)+'</i></button>';}).join('')+'</div>';
  var list=shown();
  if(!list.length)return h+'<div class="card stack" style="text-align:center"><h3>В альбомі «'+esc(M.filter)+'» ще немає файлів</h3><p class="sm mu">Обери цей альбом вище і додай фото чи відео.</p></div>';
  h+='<div class="x-media-grid">'+list.map(function(it,i){var u=urlOf(it),lab=(it.type==='video'?'Відео':'Фото')+(it.cap?': '+it.cap:'')+' · '+it.album;
    return '<button class="x-media-it" data-x="open" data-id="'+it.id+'" aria-label="'+esc(lab)+'. Відкрити на весь екран" style="animation-delay:'+Math.min(i*.04,.4)+'s">'+
    (it.type==='video'?'<video src="'+u+'#t=0.1" muted playsinline preload="metadata" tabindex="-1" aria-hidden="true"></video><span class="x-media-play" aria-hidden="true">'+ic('ply')+'</span>':'<img src="'+u+'" alt="" loading="lazy">')+
    '<span class="x-media-cap">'+(it.cap?'<b>'+esc(it.cap)+'</b>':'')+'<span>'+esc(it.album)+'</span></span></button>';}).join('')+'</div>';
  return h;
}
function draw(){if(!alive||!box)return;var f=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('data-a');box.innerHTML=bodyHtml();if(f){var b=box.querySelector('[data-x="flt"][data-a="'+f+'"]');if(b)b.focus();}}

/* ---------- lightbox ---------- */
function lbHtml(){
  var list=shown(),it=list[M.lb];if(!it)return '';var u=urlOf(it);
  return '<div class="x-media-lbtop"><span class="x-media-cnt" aria-live="polite">'+(M.lb+1)+' / '+list.length+'</span><span class="badge off">'+esc(it.album)+'</span>'+
  '<button class="ghost" data-x="lbx" aria-label="Закрити перегляд" style="min-width:48px;padding:0;font-size:22px">✕</button></div>'+
  '<div class="x-media-lbst" id="x-media-st">'+
  (list.length>1?'<button class="x-media-nav p" data-x="prev" aria-label="Попередній файл">‹</button>':'')+
  (it.type==='video'?'<video src="'+u+'" controls playsinline preload="metadata" aria-label="'+esc(it.cap||'Відео')+'"></video>':'<img src="'+u+'" alt="'+esc(it.cap||('Фото з альбому «'+it.album+'»'))+'" draggable="false">')+
  (list.length>1?'<button class="x-media-nav n" data-x="next" aria-label="Наступний файл">›</button>':'')+'</div>'+
  '<div class="x-media-lbbot stack" style="gap:10px">'+
  (M.edit?'<div class="grid2"><div><label for="x-media-ecap">Підпис</label><input id="x-media-ecap" class="x-media-in" type="text" maxlength="80" value="'+esc(it.cap||'')+'"></div>'+
     '<div><label for="x-media-ealb">Альбом</label><select id="x-media-ealb" class="x-media-sel">'+ALBUMS.map(function(a){return '<option'+(a===it.album?' selected':'')+'>'+esc(a)+'</option>';}).join('')+'</select></div></div>'+
     '<div class="row"><button class="pri" data-x="esave" style="flex:1">Зберегти</button><button data-x="ecancel" style="flex:1">Скасувати</button></div>'
  :M.del?'<div class="msg no stack" role="alertdialog" aria-label="Підтвердження видалення" style="gap:10px"><b>Видалити цей файл назавжди?</b><span class="sm">Його буде стерто з цього пристрою. Скасувати не вийде.</span>'+
     '<div class="row"><button data-x="delyes" style="flex:1;border-color:var(--bad);color:#F6B9AD">Так, видалити</button><button data-x="delno" class="pri" style="flex:1">Ні, залишити</button></div></div>'
  :'<p>'+(it.cap?esc(it.cap):'<span class="mu">Без підпису</span>')+'</p><p class="sm mu">'+(it.type==='video'?'Відео':'Фото')+' · '+mb(it.size)+' · '+new Date(it.ts).toLocaleDateString('uk-UA')+'</p>'+
     '<div class="row"><button data-x="edit" style="flex:1">Змінити підпис</button><button data-x="del" style="flex:1;border-color:var(--bad);color:#F6B9AD">Видалити</button></div>')+
  '</div>';
}
function lbOpen(i,keep){
  M.lb=i;if(!keep){M.del=false;M.edit=false;}
  if(!lbEl){lbEl=document.createElement('div');lbEl.className='x-media-lb';lbEl.setAttribute('role','dialog');lbEl.setAttribute('aria-modal','true');lbEl.setAttribute('aria-label','Перегляд медіа');
    lbEl.addEventListener('click',onClick);bindSwipe(lbEl);document.body.appendChild(lbEl);document.body.style.overflow='hidden';}
  lbEl.innerHTML=lbHtml();
  var f=lbEl.querySelector(M.edit?'#x-media-ecap':M.del?'[data-x="delno"]':'[data-x="lbx"]');if(f)try{f.focus({preventScroll:true});}catch(e){f.focus();}
}
function lbClose(){
  if(!lbEl)return;var id=(shown()[M.lb]||{}).id;M.lb=-1;M.del=false;M.edit=false;
  try{lbEl.parentNode.removeChild(lbEl);}catch(e){}lbEl=null;document.body.style.overflow='';
  if(id&&box){var b=box.querySelector('[data-id="'+id+'"]');if(b)b.focus();}
}
function lbStep(d){var n=shown().length;if(n<2||M.del||M.edit)return;lbOpen((M.lb+d+n)%n);}
function bindSwipe(el){
  var x0=null,y0=0;
  el.addEventListener('touchstart',function(e){if(!e.target.closest('#x-media-st')||e.target.tagName==='VIDEO'&&e.touches[0].clientY>e.target.getBoundingClientRect().bottom-56){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',function(e){if(x0===null)return;var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)lbStep(dx<0?1:-1);else if(dy>110&&Math.abs(dy)>Math.abs(dx)*1.5)lbClose();},{passive:true});
}
function onKey(e){
  if(M.lb<0)return;
  if(e.key==='Escape'){e.preventDefault();if(M.del||M.edit){M.del=false;M.edit=false;lbOpen(M.lb,1);}else lbClose();}
  else if(e.key==='ArrowRight'&&!isField(e.target)){e.preventDefault();lbStep(1);}
  else if(e.key==='ArrowLeft'&&!isField(e.target)){e.preventDefault();lbStep(-1);}
  else if(e.key==='Tab'&&lbEl){var f=lbEl.querySelectorAll('button,input,select,video[controls]');if(!f.length)return;var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
}
function isField(t){return t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA');}

/* ---------- actions ---------- */
function addFiles(files){
  var list=[],i;for(i=0;i<files.length;i++){var f=files[i],t=(f.type||'').split('/')[0];if(t==='image'||t==='video')list.push(f);}
  var skipped=files.length-list.length;
  if(!list.length){M.msg='Можна додати лише фото або відео.';M.ok=false;draw();return;}
  var albEl=box.querySelector('#x-media-alb'),capEl=box.querySelector('#x-media-cap');
  var album=albEl?albEl.value:M.upAlbum,cap=capEl?capEl.value.trim().slice(0,80):'';
  M.upAlbum=album;M.busy=true;M.msg='';draw();
  var done=0,fail=0,now=Date.now();
  function next(k){
    if(k>=list.length){M.busy=false;
      M.ok=!fail;M.msg=fail?('Не вдалося зберегти '+fail+' з '+list.length+'. Можливо, на пристрої замало місця.'):('Додано '+done+' '+plural(done,'файл','файли','файлів')+' до альбому «'+esc(album)+'».'+(skipped?' Інші файли пропущено.':''));
      if(M.filter!=='all'&&M.filter!==album)M.filter=album;
      if(done&&A&&A.S&&!A.S.done.media){A.S.done.media=true;A.save();}
      draw();estimate();return;}
    var f=list[k],rec={id:uid(),album:album,cap:cap,type:f.type.indexOf('video')===0?'video':'image',mime:f.type,name:String(f.name||'').slice(0,120),size:f.size||0,ts:now+k,blob:f};
    dbPut(rec,function(){done++;items.unshift(rec);next(k+1);},function(){fail++;next(k+1);});
  }
  next(0);
}
function removeCur(){
  var list=shown(),it=list[M.lb];if(!it)return;
  dbDel(it.id);items=items.filter(function(x){return x.id!==it.id;});
  try{if(urls[it.id])URL.revokeObjectURL(urls[it.id]);}catch(e){}delete urls[it.id];
  var n=shown().length;M.msg='Файл видалено.';M.ok=true;
  if(!n){lbClose();}else lbOpen(Math.min(M.lb,n-1));
  draw();estimate();
}
function saveEdit(){
  var it=shown()[M.lb];if(!it||!lbEl)return;
  var c=lbEl.querySelector('#x-media-ecap'),a=lbEl.querySelector('#x-media-ealb');
  it.cap=c?c.value.trim().slice(0,80):it.cap;var oldAlb=it.album;it.album=a?a.value:it.album;
  dbPut(it,function(){},function(){});
  M.edit=false;
  if(M.filter!=='all'&&it.album!==oldAlb){lbClose();}else lbOpen(M.lb);
  draw();
}
function onClick(e){
  var b=e.target.closest('[data-x]');if(!b)return;var x=b.getAttribute('data-x');
  if(x==='flt'){M.filter=b.getAttribute('data-a');M.msg='';draw();}
  else if(x==='open'){var id=b.getAttribute('data-id'),l=shown();for(var i=0;i<l.length;i++)if(l[i].id===id){lbOpen(i);break;}}
  else if(x==='lbx')lbClose();
  else if(x==='prev')lbStep(-1);
  else if(x==='next')lbStep(1);
  else if(x==='del'){M.del=true;lbOpen(M.lb,1);}
  else if(x==='delno'){M.del=false;lbOpen(M.lb,1);}
  else if(x==='delyes')removeCur();
  else if(x==='edit'){M.edit=true;lbOpen(M.lb,1);}
  else if(x==='ecancel'){M.edit=false;lbOpen(M.lb,1);}
  else if(x==='esave')saveEdit();
}
function onChange(e){
  var t=e.target;
  if(t.id==='x-media-file'&&t.files&&t.files.length){var fs=[];for(var i=0;i<t.files.length;i++)fs.push(t.files[i]);t.value='';addFiles(fs);}
  else if(t.id==='x-media-alb')M.upAlbum=t.value;
}

ArtanExt.view({id:'media',title:'Медіатека',sub:'Фото й відео',icon:'cam',home:true,
  render:function(api){A=api;css();return headHtml();},
  mount:function(r,api){
    A=api;root=r;box=r.querySelector('#x-media-body');alive=true;M.lb=-1;M.del=false;M.edit=false;M.busy=false;
    r.addEventListener('click',onClick);r.addEventListener('change',onChange);document.addEventListener('keydown',onKey);
    openDb(function(){loadAll(function(){if(alive){draw();estimate();}});});
    return function(){
      alive=false;r.removeEventListener('click',onClick);r.removeEventListener('change',onChange);document.removeEventListener('keydown',onKey);
      if(lbEl){try{lbEl.parentNode.removeChild(lbEl);}catch(e){}lbEl=null;document.body.style.overflow='';}
      M.msg='';revokeAll();items=[];root=null;box=null;
    };
  }});
})();

'.x-events-today li{margin:4px 0}';
document.head.appendChild(s);}

function esc(s){return A.esc(s==null?'':s);}
function ic(k){return A.icon(A.I[k]||A.I.info);}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function todayIso(){return iso(new Date());}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* Ukrainian names via Intl with static fallback */
var FB_M=['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'];
var FB_MG=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
var FB_W=['пн','вт','ср','чт','пт','сб','нд'];
function fmt(d,o,fb){try{return new Intl.DateTimeFormat('uk-UA',o).format(d);}catch(e){return fb;}}
function monthName(y,m){var s=fmt(new Date(y,m,1),{month:'long'},FB_M[m]);if(/[ая]$/.test(s)&&s!==FB_M[m])s=FB_M[m];return cap1(s)+' '+y;}
function wdNames(){var r=[];for(var i=0;i<7;i++)r.push(fmt(new Date(2024,0,1+i),{weekday:'short'},FB_W[i]).replace('.',''));return r;}
function shortDate(s){var d=parse(s);if(!d)return '[ДАТА]';return d.getDate()+'<br>'+fmt(d,{month:'short'},FB_MG[d.getMonth()]).replace('.','').toUpperCase().slice(0,4);}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function longDate(s){var d=parse(s);if(!d)return '[ДАТА]';return cap1(fmt(d,{weekday:'long',day:'numeric',month:'long'},d.getDate()+'.'+pad(d.getMonth()+1)));}

/* Built-in samples: no real dates — placeholders only. */
function samples(){
  var sp=A.SPACES||[],c0=sp[0]?sp[0].c:'[МІСТО]',hasV=sp.some(function(s){return s.c==='Вінниця';});
  return [
    {id:'x1',ex:1,t:'«Звитяга»: заїзд на вишкіл',city:'[ОБЛАСТЬ]',time:'',note:'П\'ять днів з інструкторами: такмед, дрони, топографія. Для молоді 13–20 років. Дату й місце дивись в офіційних анонсах.',go:'#zvytiaha',goT:'Подати заявку'},
    {id:'x2',ex:1,t:'Зустріч у просторі «Артан»',city:c0,time:'[ЧАС]',note:'Відкриті двері для ветеранів і родин: консультації та підтримка. Адреса: [АДРЕСА].',go:'#map',goT:'Карта просторів'},
    {id:'x3',ex:1,t:'Турнір під егідою «Артану»',city:hasV?'Вінниця':'[МІСТО]',time:'',note:'Спортивні змагання серед дітей та молоді. Дату, вік учасників і реєстрацію уточнюй на офіційних сторінках.',go:'#social',goT:'Офіційні сторінки'}
  ];
}
function mine(){if(!A.S.events||Object.prototype.toString.call(A.S.events)!=='[object Array]')A.S.events=[];return A.S.events;}
function sortEv(a,b){return (a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99'));}
function cityOk(ev){return E.city==='all'||ev.city===E.city;}
function onDay(s){return mine().filter(function(e){return e.date===s;});}
function cities(){var seen={},r=[];mine().forEach(function(e){if(e.city&&!seen[e.city]){seen[e.city]=1;r.push(e.city);}});samples().forEach(function(e){if(e.city.charAt(0)!=='['&&!seen[e.city]){seen[e.city]=1;r.push(e.city);}});return r;}

function agendaHtml(){
  var t=todayIso(),all=mine().filter(cityOk).sort(sortEv),h='';
  var cs=cities();
  h+='<div class="stack" style="gap:8px"><h2>Розклад</h2>'+(cs.length?'<div class="x-events-chips" role="toolbar" aria-label="Фільтр за містом"><button class="chip'+(E.city==='all'?' on':'')+'" data-x="city" data-c="all" aria-pressed="'+(E.city==='all')+'">Усі міста</button>'+
  cs.map(function(c){var on=E.city===c;return '<button class="chip'+(on?' on':'')+'" data-x="city" data-c="'+esc(c)+'" aria-pressed="'+on+'">'+esc(c)+'</button>';}).join('')+'</div>':'')+'</div>';
  if(E.sel){var ds=all.filter(function(e){return e.date===E.sel;});
    h+='<div class="row sb"><h3>'+esc(longDate(E.sel))+'</h3><button class="ghost" data-x="unsel" style="min-height:40px">Усі дні</button></div>'+
    (ds.length?ds.map(evHtml).join(''):'<div class="card stack"><p class="sm mu">На цей день подій немає'+(E.city!=='all'?' у місті «'+esc(E.city)+'»':'')+'.</p><button data-x="add" class="pri">Додати подію на цей день</button></div>');}
  else{
    var up=all.filter(function(e){return e.date>=t;}),past=all.filter(function(e){return e.date<t;}).reverse();
    h+=up.length?up.map(evHtml).join(''):'<div class="card stack" style="text-align:center"><div class="big" aria-hidden="true">🗓️</div><h3>'+(mine().length&&E.city!=='all'?'Немає подій у місті «'+esc(E.city)+'»':'Твоїх запланованих подій поки немає')+'</h3><p class="sm mu">Натисни на день у календарі або «Додати подію». Можна взяти за основу приклад нижче.</p></div>';
    if(past.length)h+='<details><summary>Минулі події ('+past.length+')</summary><div class="stack" style="padding-bottom:12px">'+past.map(evHtml).join('')+'</div></details>';
  }
  var ex=samples().filter(cityOk);
  if(ex.length)h+='<div class="stack" style="gap:8px;margin-top:6px"><h2>Приклади подій</h2><p class="sm mu">Це зразки без реальних дат. Точні дати й місця — лише в офіційних анонсах підрозділу.</p>'+ex.map(evHtml).join('')+'</div>';
  return h;
}
function bodyHtml(){
  return todayHtml()+calHtml()+(E.form?formHtml():'')+(E.msg?'<div class="msg '+(E.ok?'ok':'no')+'" role="status">'+E.msg+'</div>':'')+agendaHtml();
}
function draw(focusSel){if(!alive||!box)return;box.innerHTML=bodyHtml();if(focusSel){var el=box.querySelector(focusSel);if(el)try{el.focus({preventScroll:false});}catch(e){el.focus();}}}

/* ---------- form ---------- */
function readForm(){
  var f=E.form;if(!f||!box)return;var g=function(id){var el=box.querySelector('#'+id);return el?el.value:null;};
  var v;if((v=g('x-events-t'))!==null)f.t=v;if((v=g('x-events-d'))!==null)f.date=v;if((v=g('x-events-tm'))!==null)f.time=v;if((v=g('x-events-n'))!==null)f.note=v;
  var c=g('x-events-c');if(c!==null){if(c==='__own'){if(!f.own){f.own=true;f.city='';}else{var o=g('x-events-co');if(o!==null)f.city=o;}}else{f.own=false;f.city=c;}}
}
function openForm(f){E.form=f;E.del=null;E.msg='';draw('#x-events-t');var fm=box.querySelector('#x-events-form');if(fm&&fm.scrollIntoView)fm.scrollIntoView({block:'center',behavior:'smooth'});}
function submit(){
  readForm();var f=E.form;f.t=(f.t||'').trim().slice(0,80);f.note=(f.note||'').trim().slice(0,300);f.city=(f.city||'').trim().slice(0,30);
  if(!f.t){f.err='t';draw('#x-events-t');return;}
  if(!parse(f.date)){f.err='d';draw('#x-events-d');return;}
  if(!/^\d{2}:\d{2}$/.test(f.time||''))f.time='';
  var list=mine(),rec={id:f.id||uid(),t:f.t,date:f.date,time:f.time,city:f.city,note:f.note,ts:Date.now()};
  if(f.id){for(var i=0;i<list.length;i++)if(list[i].id===f.id){list[i]=rec;break;}}else list.push(rec);
  A.save();
  var d=parse(f.date);E.y=d.getFullYear();E.m=d.getMonth();E.sel=f.date;
  if(E.city!=='all'&&E.city!==rec.city)E.city='all';
  E.msg=f.id?'Подію оновлено.':'Подію збережено. Її видно в календарі.';E.ok=true;E.form=null;
  if(!f.id&&!A.S.done.events){A.S.done.events=true;A.save();}
  draw();
}

/* ---------- .ics export ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function fold(line){var out='',n=0,cur='';for(var i=0;i<line.length;i++){var ch=line.charAt(i),b=encodeURIComponent(ch).replace(/%[0-9A-F]{2}/g,'x').length;if(n+b>73){out+=cur+'\r\n ';cur='';n=1;}cur+=ch;n+=b;}return out+cur;}
function stamp(d){return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';}
function loc(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';}
function ics(e){
  var d=parse(e.date),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Artan//Calendar//UK','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+e.id+'@artan.local','DTSTAMP:'+stamp(new Date())];
  if(e.time){var p=e.time.split(':'),s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]),en=new Date(s.getTime()+3600000);L.push('DTSTART:'+loc(s),'DTEND:'+loc(en));}
  else{var nx=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);L.push('DTSTART;VALUE=DATE:'+iso(d).replace(/-/g,''),'DTEND;VALUE=DATE:'+iso(nx).replace(/-/g,''));}
  L.push('SUMMARY:'+icsEsc(e.t));if(e.city)L.push('LOCATION:'+icsEsc(e.city));if(e.note)L.push('DESCRIPTION:'+icsEsc(e.note));
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.t),'TRIGGER:'+(e.time?'-PT1H':'-PT15H'),'END:VALARM','END:VEVENT','END:VCALENDAR');
  return L.map(fold).join('\r\n')+'\r\n';
}
function fname(e){return ('Артан-'+e.date+'-'+e.t).replace(/[^\wА-Яа-яЇїІіЄєҐґ\- ]/g,'').replace(/\s+/g,'-').slice(0,60)+'.ics';}
function exportIcs(id){
  var e=mine().filter(function(x){return x.id===id;})[0];if(!e)return;
  var txt=ics(e),fn=fname(e),blob=new Blob([txt],{type:'text/calendar;charset=utf-8'});
  E.dlink=null;
  var fallback=function(){E.dlink={id:id,fn:fn,href:'data:text/calendar;charset=utf-8,'+encodeURIComponent(txt)};E.msg='';draw('[data-x="ics"][data-id="'+id+'"]');};
  var go=function(api){
    if(!alive)return;
    if(!api){fallback();return;}
    api.save({filename:fn,data:blob}).then(function(){E.msg='Файл «'+esc(fn)+'» збережено. Відкрий його, щоб додати подію в календар телефона.';E.ok=true;draw();},
      function(err){E.msg=err&&err.code==='declined'?'Збереження скасовано.':'Не вдалося зберегти файл. Спробуй ще раз.';E.ok=false;draw();});
  };
  var p;try{p=A.dl();}catch(x){p=null;}
  if(p&&p.then)p.then(go,function(){go(null);});else go(null);
}

/* ---------- events ---------- */
function onClick(ev){
  var b=ev.target.closest('[data-x]');if(!b||!box||!box.contains(b))return;var x=b.getAttribute('data-x'),id=b.getAttribute('data-id');
  if(x==='mprev'||x==='mnext'){readForm();E.m+=x==='mprev'?-1:1;if(E.m<0){E.m=11;E.y--;}if(E.m>11){E.m=0;E.y++;}draw('[data-x="'+x+'"]');}
  else if(x==='mtoday'){readForm();var n=new Date();E.y=n.getFullYear();E.m=n.getMonth();E.sel=todayIso();draw('[data-x="mtoday"]');}
  else if(x==='day'){readForm();var s=b.getAttribute('data-d'),d=parse(s);E.sel=E.sel===s?null:s;if(d.getMonth()!==E.m){E.y=d.getFullYear();E.m=d.getMonth();}if(E.form&&E.sel&&!E.form.id)E.form.date=E.sel;E.msg='';draw('[data-x="day"][data-d="'+s+'"]');}
  else if(x==='unsel'){E.sel=null;draw();}
  else if(x==='add'){openForm({id:null,t:'',date:E.sel||todayIso(),time:'',city:A.S.city&&(A.SPACES||[]).some(function(s){return s.c===A.S.city;})?A.S.city:'',own:false,note:'',err:''});}
  else if(x==='fromex'){var sx=samples().filter(function(s){return s.id===id;})[0];if(!sx)return;var real=sx.city.charAt(0)!=='[';
    openForm({id:null,t:sx.t,date:E.sel||'',time:'',city:real?sx.city:'',own:false,note:'Дату уточнити в офіційному анонсі.',err:''});}

<script>/* js/tablet.js */
/* ARTAN «Оперативний планшет»: HQ radar home, radial quick menu, adult/kid modes,
   «Шлях захисника» campaign path, rank chevrons, achievement patches, level-up overlay. */
(function(){
var A=window.ArtanAPI;if(!A)return;
var S=A.S,ui=A.ui,EXT=A.EXT,VIEWS=A.VIEWS,I=A.I,esc=A.esc;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(s,r){return (r||document).querySelector(s);}
function ico(k,w){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"'+(w?' style="width:'+w+'px;height:'+w+'px"':'')+'>'+(I[k]||I.info)+'</svg>';}
var EXTRA_I={path:'<path d="M4 20c3-1 3-5 6-6s5 1 7-2 1-6 3-8"/><circle cx="4" cy="20" r="1.6"/><circle cx="20" cy="4" r="1.6"/>',
  hq:'<path d="M12 3l9 5v8l-9 5-9-5V8z" fill="currentColor" fill-opacity=".2"/><path d="M12 8v8M8 10.5l4 2.5 4-2.5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3" fill="currentColor" fill-opacity=".2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  dip:'<path d="M5 3h14v14l-7 4-7-4z" fill="currentColor" fill-opacity=".2"/><path d="M9 9h6M9 13h4"/>'};
for(var k in EXTRA_I)if(!I[k])I[k]=EXTRA_I[k];

/* ---------- mode ---------- */
function kid(){return S.mode==='kid';}
function applyMode(){document.body.classList.toggle('kid',kid());}
function setMode(m){S.mode=m;A.save();applyMode();if(m==='kid'&&!S.age){S.age=6;A.save();}A.render(true);}

/* ---------- topographic background ---------- */
(function topo(){
  var r=(function(seed){return function(){seed=(seed*16807)%2147483647;return seed/2147483647;};})(7);
  var out='',W=900,H=900;
  for(var c=0;c<7;c++){var cx=r()*W,cy=r()*H,ph=r()*6,ph2=r()*6,a1=.06+r()*.06,a2=.04+r()*.05;
    for(var ring=1;ring<=7;ring++){var R=ring*26+r()*8,d='';
      for(var t=0;t<=64;t++){var th=t/64*Math.PI*2,rr=R*(1+a1*Math.sin(3*th+ph)+a2*Math.sin(5*th+ph2+ring*.3));
        d+=(t?'L':'M')+(cx+rr*Math.cos(th)).toFixed(1)+' '+(cy+rr*Math.sin(th)).toFixed(1);}
      out+='<path d="'+d+'Z"/>';}}
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><g fill="none" stroke="#BFC48F" stroke-opacity=".07" stroke-width="1">'+out+'</g></svg>';
  document.documentElement.style.setProperty('--topo','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")');
})();

/* ---------- ranks & chevrons ---------- */
function rankIdx(){var r=A.rank();for(var i=0;i<A.RANKS.length;i++)if(A.RANKS[i][1]===r.name)return i;return 0;}
function chevron(i,big){
  var c='var(--ye)',body='<path d="M8 4h44v42c0 10-10 16-22 20C18 62 8 56 8 46z" fill="#161A12" stroke="'+c+'" stroke-width="2"/>';
  if(i===0)body+='<rect x="18" y="30" width="24" height="5" rx="1" fill="'+c+'"/>';
  var n=Math.min(i,3);for(var k=0;k<n;k++){var y=44-k*11;body+='<path d="M16 '+y+'L30 '+(y-9)+'L44 '+y+'" fill="none" stroke="'+c+'" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>';}
  if(i>=4)body+='<path d="M30 9l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="'+c+'"/>';
  return '<svg viewBox="0 0 60 70" aria-hidden="true"'+(big?'':' width="16" height="18"')+'>'+body+'</svg>';}
var lastRank=null;
function onSave(){var i=rankIdx();if(lastRank===null){lastRank=i;return;}if(i>lastRank){lastRank=i;levelUp(i);}else lastRank=i;}
function levelUp(i){var o=document.createElement('div');o.className='lvl';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Нове звання');
  o.innerHTML='<div class="in">'+chevron(i,true)+'<p class="ey">Нове звання</p><h1>'+esc(A.RANKS[i][1])+'</h1><p class="mu">'+(kid()?'Ти молодець! Так тримати.':'Знання, які бережуть життя. Продовжуй шлях.')+'</p><button class="pri" type="button">Далі</button></div>';
  document.body.appendChild(o);A.confetti();var b=o.querySelector('button');b.focus();b.onclick=function(){o.remove();};}

/* ---------- sections ---------- */
function sections(all){
  var base=[
    {h:'#unit',ic:'ops',t:'Підрозділ',sh:'ПІДРОЗДІЛ',seg:'ops',ad:1},
    {h:'#unit',ic:'mem',t:'Стіна пам\'яті',sh:'ПАМ\'ЯТЬ',seg:'mem',ad:1,kd:1},
    {h:'#map',ic:'map',t:'Карта просторів',sh:'КАРТА',ad:1,kd:1},
    {h:'#school',ic:'path',t:'Шлях захисника',sh:'ШЛЯХ',ad:1,kd:1},
    {h:'#zvytiaha',ic:'flag',t:'Вишкіл «Звитяга»',sh:'ЗВИТЯГА',ad:1}];
  EXT.views.forEach(function(v){base.push({h:'#'+v.id,ic:v.id==='events'?'cal':(v.icon||'info'),t:v.title,sh:(v.short||v.title.split(' ')[0]).toUpperCase().slice(0,10),ad:v.home?1:0,kd:v.id==='media'?1:0,ext:1});});
  base.push({h:'#diploma',ic:'dip',t:'Диплом захисника',sh:'ДИПЛОМ',kd:1});
  base.push({h:'#sos',ic:'sos',t:'SOS-пам\'ятка',sh:'SOS',ad:1,kd:1});
  if(all){base.push({h:'#projects',ic:'ppl',t:'Проєкти',sh:''},{h:'#merch',ic:'tee',t:'Мерч',sh:''},{h:'#social',ic:'soc',t:'Соцмережі',sh:''},{h:'#more',ic:'info',t:'Більше',sh:''});
    base.unshift({h:'#home',ic:'hq',t:'Штаб',sh:''});return base;}
  return base.filter(function(s){return kid()?s.kd:s.ad;});}
function secAttrs(s){return 'href="'+s.h+'"'+(s.seg?' data-act="seg" data-s="'+s.seg+'"':'');}

/* ---------- radar ---------- */
function radar(list){
  var n=list.length,C=200,R=188,r0=58,out='',p=function(r,a){return (C+r*Math.cos(a)).toFixed(1)+' '+(C+r*Math.sin(a)).toFixed(1);};
  var rings='';[58,100,145,188].forEach(function(r){rings+='<circle class="ring" cx="200" cy="200" r="'+r+'"/>';});
  for(var t=0;t<72;t++){var a=t/72*Math.PI*2,l=t%6?5:11;rings+='<line class="tick" x1="'+(C+(R+2)*Math.cos(a)).toFixed(1)+'" y1="'+(C+(R+2)*Math.sin(a)).toFixed(1)+'" x2="'+(C+(R+2+l)*Math.cos(a)).toFixed(1)+'" y2="'+(C+(R+2+l)*Math.sin(a)).toFixed(1)+'"/>';}
  list.forEach(function(s,i){var gap=.025,a0=-Math.PI/2+i*2*Math.PI/n+gap,a1=-Math.PI/2+(i+1)*2*Math.PI/n-gap,am=(a0+a1)/2;
    var d='M'+p(r0,a0)+'L'+p(R,a0)+'A'+R+' '+R+' 0 0 1 '+p(R,a1)+'L'+p(r0,a1)+'A'+r0+' '+r0+' 0 0 0 '+p(r0,a0)+'Z';
    var lr=n>8?132:126,lx=C+lr*Math.cos(am),ly=C+lr*Math.sin(am);
    out+='<a class="sec" '+secAttrs(s)+' aria-label="'+esc(s.t)+'" style="--i:'+i+'"><path d="'+d+'"/><g transform="translate('+(lx-14).toFixed(1)+' '+(ly-26).toFixed(1)+') scale(1.15)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(I[s.ic]||I.info)+'</g><text x="'+lx.toFixed(1)+'" y="'+(ly+16).toFixed(1)+'">'+esc(s.sh)+'</text></a>';});
  var blips='';for(var b=0;b<4;b++){var ba=Math.random()*Math.PI*2,br=70+Math.random()*100;blips+='<circle class="blip" cx="'+(C+br*Math.cos(ba)).toFixed(1)+'" cy="'+(C+br*Math.sin(ba)).toFixed(1)+'" r="2.6" style="animation-delay:'+(b*.6)+'s"/>';}
  var sweep='<defs><linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2C230" stop-opacity="0"/><stop offset="1" stop-color="#F2C230" stop-opacity=".28"/></linearGradient></defs><g class="sweep"><path d="M200 200L200 12A188 188 0 0 1 333 67Z" fill="url(#swg)"/></g>';
  var core='<a class="core" href="#school" aria-label="Шлях захисника: продовжити"><circle class="c1" cx="200" cy="200" r="52"/><image href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22g%22%20cx%3D%2250%25%22%20cy%3D%2245%25%22%20r%3D%2260%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232A3020%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230E110B%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2256%22%20fill%3D%22url%28%23g%29%22%20stroke%3D%22%23F2C230%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22%23BFC48F%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.5%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%23BFC48F%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.5%22/%3E%3Cpath%20d%3D%22M60%208v14M60%2098v14M8%2060h14M98%2060h14%22%20stroke%3D%22%23BFC48F%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M60%2026l9%2034-9%2034-9-34z%22%20fill%3D%22%23F2C230%22/%3E%3Cpath%20d%3D%22M60%2026l9%2034H51z%22%20fill%3D%22%23FFE08A%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%225%22%20fill%3D%22%230E110B%22%20stroke%3D%22%23F2C230%22%20stroke-width%3D%222%22/%3E%3C/svg%3E" x="166" y="160" width="68" height="68"/><text x="200" y="240">ШЛЯХ</text></a>';
  return '<div class="radar"><svg viewBox="-20 -20 440 440" role="group" aria-label="Сектори штабу">'+sweep+rings+blips+out+core+'</svg></div>';}

/* ---------- status strip ---------- */
function clock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function status(){var r=A.rank();
  return '<div class="status hud-frame" role="group" aria-label="Статус"><div><span>Час</span><b id="tclk">'+clock()+'</b></div><div><span>Мовчання 9:00</span><b id="sil">'+A.silence()+'</b></div><div><span>Звання</span><b title="'+esc(r.name)+'">'+chevron(rankIdx())+esc(r.name)+'</b></div><div><span>Бали'+(S.streak>1?' · серія '+S.streak:'')+'</span><b>'+S.xp+'</b></div></div>';}
function modeSw(){return '<div class="modesw" role="group" aria-label="Режим"><button type="button" data-t="mode" data-m="adult" aria-pressed="'+!kid()+'">Дорослий</button><button type="button" data-t="mode" data-m="kid" aria-pressed="'+kid()+'">Юний</button></div>';}

/* ---------- path nodes ---------- */
var BUILTIN=[{id:'touch',e:'🃏',t:'Чіпати чи ні?',d:'Гортай картки: праворуч — можна, ліворуч — небезпечно. 3 життя.',min:6},
  {id:'pack',e:'🎒',t:'Тривожний наплічник',d:'Збери 8 потрібних речей, поки біжить час.',min:6},
  {id:'mem',e:'🧠',t:'Номери порятунку',d:'Знайди пари: номер і служба.',min:6},
  {id:'morse',e:'📡',t:'Азбука Морзе',d:'Розшифруй сигнал ліхтарика: крапки й тире.',min:10}];
function nodes(){var age=S.age||6,ms=A.MISSIONS.filter(function(m){return m.min<=age;}).map(function(m){return {k:'m',id:m.id,t:m.t,d:m.tips&&m.tips[0]||'',e:null};});
  var gs=BUILTIN.filter(function(g){return g.min<=age;}).map(function(g){return {k:'g',id:g.id,t:g.t,d:g.d,e:g.e};})
    .concat(EXT.games.filter(function(g){return !g.min||g.min<=age;}).map(function(g){return {k:'g',id:g.id,t:g.title,d:g.desc,e:g.emoji};}));
  var out=[],mi=0,gi=0;while(mi<ms.length||gi<gs.length){if(mi<ms.length)out.push(ms[mi++]);if(mi<ms.length&&out.length%3!==2)out.push(ms[mi++]);if(gi<gs.length)out.push(gs[gi++]);}
  var done=0;out.forEach(function(n){n.done=!!S.done[n.id];if(n.done)done++;});
  out.forEach(function(n,i){n.open=n.done||i<done+3;});
  var nx=out.filter(function(n){return n.open&&!n.done;})[0];if(nx)nx.next=true;
  return out;}
function pathHTML(){var ns=nodes(),step=112,H=ns.length*step+70,W=340,pts=[];
  ns.forEach(function(n,i){pts.push([W/2+(W*.3)*Math.sin(i*1.15),50+i*step]);});
  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1];for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=' C'+a[0].toFixed(1)+' '+my+' '+b[0].toFixed(1)+' '+my+' '+b[0].toFixed(1)+' '+b[1];}
  var doneN=ns.filter(function(n){return n.done;}).length,len=ns.length*step*1.25,frac=ns.length>1?Math.min(1,(ns.indexOf(ns.filter(function(n){return n.next;})[0])>-1?ns.indexOf(ns.filter(function(n){return n.next;})[0]):ns.length-1)/(ns.length-1)):0;
  var h='<div class="path" style="height:'+H+'px" role="list" aria-label="Шлях захисника: '+doneN+' з '+ns.length+' пройдено"><svg class="trail" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path class="road" d="'+d+'"/><path class="dash" d="'+d+'"/><path class="walked" d="'+d+'" pathLength="1000" style="--len:1000;--off:'+Math.round(1000*(1-frac))+'"/></svg>';
  h+='<span class="path-flag" style="left:50%;top:22px">СТАРТ</span>';
  ns.forEach(function(n,i){var x=pts[i][0]/W*100,y=pts[i][1];
    h+='<button role="listitem" type="button" class="node'+(n.done?' done':'')+(n.next?' next':'')+(n.open?'':' lock')+'" style="left:'+x.toFixed(2)+'%;top:'+y+'px;--i:'+i+'" data-t="node" data-n="'+i+'" aria-label="'+esc(n.t)+(n.done?', пройдено':n.open?'':', поки закрито')+'">'+(n.e?'<span aria-hidden="true">'+n.e+'</span>':ico(n.k==='m'?'sch':'flag'))+'</button>';
    h+='<div class="node-l" style="left:'+x.toFixed(2)+'%;top:'+(y+38)+'px">'+esc(n.t)+'<small>'+(n.k==='m'?'МІСІЯ':'ГРА')+'</small></div>';});
  return h+'</div>';}
function openSheet(n){closeSheet();var bg=document.createElement('div');bg.className='sheet-bg';var sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-label',n.t);
  var start=n.k==='m'?'<button class="pri" data-act="mission" data-id="'+n.id+'" data-t="closesheet">'+(n.done?'Пройти ще раз':'Почати місію')+'</button>':'<button class="pri" data-act="game" data-g="'+n.id+'" data-t="closesheet">'+(n.done?'Зіграти ще':'Грати')+'</button>';
  sh.innerHTML='<div class="grab" aria-hidden="true"></div><p class="ey">'+(n.k==='m'?'Брифінг місії':'Гра')+'</p><h2>'+esc(n.t)+'</h2><p class="mu">'+esc(n.d)+'</p>'+
   (n.k==='m'?'<p class="sm mono" style="color:var(--ac)">УРОК + 3 ЗАПИТАННЯ · ДО 30 БАЛІВ</p>':'')+
   (n.open?start:'<div class="msg no">Пройди попередні завдання, щоб відкрити це.</div>')+'<button class="ghost" type="button" data-t="closesheet">Закрити</button>';
  bg.onclick=closeSheet;document.body.appendChild(bg);document.body.appendChild(sh);(sh.querySelector('.pri')||sh.querySelector('.ghost')).focus();}
function closeSheet(){var a=$('.sheet'),b=$('.sheet-bg');if(a)a.remove();if(b)b.remove();}

/* ---------- patches wall ---------- */
var PCOL=['#F2C230','#BFC48F','#7BC47F','#E9A15B','#8FB8D8','#D9A0C8'];
function patch(n,i){var c=PCOL[i%PCOL.length],L=(n.t||'?').replace(/[«»"]/g,'').trim().charAt(0).toUpperCase();
  return '<div class="patch '+(n.done?'on':'off')+'"><svg viewBox="0 0 64 72" aria-hidden="true"><path d="M32 3l26 9v22c0 17-12 28-26 35C18 62 6 51 6 34V12z" fill="#151910" stroke="'+c+'" stroke-width="2.5"/><path d="M32 9l20 7v18c0 13-9 22-20 28-11-6-20-15-20-28V16z" fill="none" stroke="'+c+'" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/><text x="32" y="44" text-anchor="middle" font-family="Oswald,sans-serif" font-size="24" font-weight="600" fill="'+c+'">'+esc(L)+'</text></svg><span>'+esc(n.t)+'</span></div>';}
function patchesHTML(){var ns=nodes(),d=ns.filter(function(n){return n.done;}).length;
  return '<div class="stack"><div class="row sb"><h2>Шеврони</h2><span class="badge">'+d+' / '+ns.length+'</span></div><div class="patches">'+ns.map(patch).join('')+'</div></div>';}

/* ---------- HOME (Штаб) ---------- */
var oldHome=VIEWS.home,oldSchool=VIEWS.school;
function greet(){var h=new Date().getHours();return h<5?'Доброї ночі':h<12?'Доброго ранку':h<18?'Доброго дня':'Доброго вечора';}
function head(){return '<header class="t-head"><div class="who"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22g%22%20cx%3D%2250%25%22%20cy%3D%2245%25%22%20r%3D%2260%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232A3020%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230E110B%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2256%22%20fill%3D%22url%28%23g%29%22%20stroke%3D%22%23F2C230%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22%23BFC48F%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.5%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%23BFC48F%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.5%22/%3E%3Cpath%20d%3D%22M60%208v14M60%2098v14M8%2060h14M98%2060h14%22%20stroke%3D%22%23BFC48F%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M60%2026l9%2034-9%2034-9-34z%22%20fill%3D%22%23F2C230%22/%3E%3Cpath%20d%3D%22M60%2026l9%2034H51z%22%20fill%3D%22%23FFE08A%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%225%22%20fill%3D%22%230E110B%22%20stroke%3D%22%23F2C230%22%20stroke-width%3D%222%22/%3E%3C/svg%3E" alt="Знак застосунку"><div><div class="wm">АРТАН</div><p>'+greet()+(S.call?', «'+esc(S.call)+'»':'')+'</p></div></div>'+modeSw()+'</header>';}
function daily(){var dd=S.daily===A.today();return '<div class="row sb"><p class="sm"><span class="mono" style="color:var(--ac)">ВИКЛИК ДНЯ</span><br>20 присідань і 10 віджимань</p><button data-act="daily" class="'+(dd?'':'pri')+'" style="min-height:42px;flex:none"'+(dd?' disabled':'')+'>'+(dd?'Виконано':'+5 балів')+'</button></div>';}
function vHQ(){
  if(kid()){var ns=nodes(),nx=ns.filter(function(n){return n.next;})[0];
    return head()+status()+
    '<div class="card stack hud-frame"><p class="ey">Твоє наступне завдання</p>'+(nx?'<div class="kid-go"><button type="button" class="node next" data-t="node" data-n="'+ns.indexOf(nx)+'" aria-label="Відкрити: '+esc(nx.t)+'">'+(nx.e?'<span aria-hidden="true">'+nx.e+'</span>':ico('sch'))+'</button><div><h2>'+esc(nx.t)+'</h2><p class="sm mu">'+(nx.k==='m'?'Місія':'Гра')+' · Шлях захисника</p></div></div>':'<h2>Увесь шлях пройдено!</h2>')+'<a class="btn pri" href="#school">Відкрити Шлях '+ico('arr')+'</a></div>'+
    radar(sections())+'<div class="card stack">'+daily()+'</div>'+
    '<a class="btn sosb" href="#sos">'+ico('sos')+'Що робити в небезпеці</a>';}
  var tpl=document.createElement('template');tpl.innerHTML=oldHome();var root=tpl.content;
  ['header.top','.grid2','.sosb'].forEach(function(s){var e=root.querySelector(s);if(e)e.remove();});
  [].slice.call(root.querySelectorAll('.card')).forEach(function(c){if(c.querySelector('#car')||c.querySelector('#sil')||/Твоє звання/.test(c.textContent))c.remove();});
  var hero=root.querySelector('.hero');var heroH=hero?hero.outerHTML:'';if(hero)hero.remove();
  var rest='';[].slice.call(root.children).forEach(function(e){rest+=e.outerHTML;});
  return head()+status()+radar(sections())+
   '<div class="card brief hud-frame"><div class="row sb"><p class="ey">Брифінг дня</p><span class="dl">'+new Date().toLocaleDateString('uk-UA',{day:'numeric',month:'long'})+'</span></div><div id="car"></div><div class="dots" role="tablist" aria-label="Операції">'+A.OPS.map(function(o,i){return '<button role="tab" aria-label="'+esc(o.t)+'" data-act="car" data-i="'+i+'"><i></i></button>';}).join('')+'</div>'+daily()+'</div>'+
   heroH+'<a class="btn sosb" href="#sos">'+ico('sos')+'SOS-пам\'ятка: що робити в небезпеці</a>'+rest;}
VIEWS.home=vHQ;

/* ---------- SCHOOL with campaign path ---------- */
VIEWS.school=function(){var h=oldSchool();if(ui.game||ui.mission||ui.ss==='lb'||!S.age)return h;
  var tpl=document.createElement('template');tpl.innerHTML=h;var root=tpl.content;
  [].slice.call(root.children).forEach(function(e){var h2=e.querySelector&&e.querySelector('h2');var t=h2?h2.textContent:'';
    if(/^Місії програми|^Ігри$|^Відзнаки$/.test(t))e.remove();else if(e.matches&&e.matches('button[data-act="game"]'))e.remove();});
  var ag=[].slice.call(root.children).filter(function(e){var h2=e.querySelector&&e.querySelector('h2');return h2&&/^Програма за віком/.test(h2.textContent);})[0];
  var ns=nodes(),dn=ns.filter(function(n){return n.done;}).length;
  var block=document.createElement('div');block.className='stack';
  block.innerHTML='<div class="row sb"><h2>Шлях захисника</h2><span class="badge">'+dn+' / '+ns.length+'</span></div><p class="sm mu">Місії й ігри відкриваються по черзі. Торкнись точки, щоб побачити брифінг.</p>'+pathHTML();
  if(ag)ag.parentNode.insertBefore(block,ag.nextSibling);else root.appendChild(block);
  var w=document.createElement('div');w.innerHTML=patchesHTML();root.appendChild(w.firstChild);
  var out='';[].slice.call(root.childNodes).forEach(function(e){out+=e.outerHTML||'';});return out;};

/* ---------- radial quick menu ---------- */
var rb=$('#radarBtn'),qm=null;
function openMenu(){if(qm)return closeMenu();qm=document.createElement('div');qm.className='qmenu';qm.setAttribute('role','dialog');qm.setAttribute('aria-modal','true');qm.setAttribute('aria-label','Усі сектори');
  qm.innerHTML='<div class="qwrap"><h2>СЕКТОРИ ПЛАНШЕТА</h2><div class="qgrid">'+sections(true).map(function(s,i){return '<a '+secAttrs(s)+' style="--i:'+i+'" data-t="qgo">'+ico(s.ic,26)+esc(s.t)+'</a>';}).join('')+'</div><button type="button" class="qclose" data-t="qclose">Закрити</button></div>';
  document.body.appendChild(qm);rb.setAttribute('aria-expanded','true');qm.querySelector('a').focus();}
function closeMenu(){if(!qm)return;qm.remove();qm=null;rb.setAttribute('aria-expanded','false');rb.focus();}
rb.addEventListener('click',openMenu);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(qm){closeMenu();}else if($('.sheet'))closeSheet();else{var l=$('.lvl');if(l)l.remove();}}
  if(e.key==='Tab'){var box=qm||$('.sheet')||$('.lvl');if(!box)return;var f=box.querySelectorAll('a,button');if(!f.length)return;var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});

/* ---------- own actions ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;var t=b.getAttribute('data-t');
  if(t==='mode')setMode(b.getAttribute('data-m'));
  else if(t==='node'){var n=nodes()[+b.getAttribute('data-n')];if(n)openSheet(n);}
  else if(t==='closesheet')closeSheet();
  else if(t==='qclose')closeMenu();
  else if(t==='qgo'){if(qm){qm.remove();qm=null;rb.setAttribute('aria-expanded','false');}}
});

/* ---------- view transitions between sections ---------- */
document.addEventListener('click',function(e){
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey)return;
  var a=e.target.closest('a[href^="#"]');if(!a||a.target)return;var h=a.getAttribute('href');if(h.length<2)return;
  if(!document.startViewTransition||reduce)return;
  if(h===location.hash){return;}
  e.preventDefault();closeSheet();
  document.startViewTransition(function(){ui.mission=null;ui.game=null;if(!a.matches('[data-act="op"]'))ui.op=null;history.pushState(null,'',h);A.render(true);});
});
window.addEventListener('popstate',function(){});

/* clock tick on HQ */
setInterval(function(){var c=$('#tclk');if(c)c.textContent=clock();},20000);

window.ArtanTablet={onSave:onSave,chevron:chevron,nodes:nodes};
lastRank=rankIdx();
applyMode();
A.render(false);
})();

</script>
</body>
